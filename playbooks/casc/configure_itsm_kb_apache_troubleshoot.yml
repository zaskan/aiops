---
- name: Publish ITSM KB article for Apache alert remediation
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../group_vars/all/aap_apache_troubleshoot_pipeline.yml
    - ../../group_vars/all/itsm_kb_apache_troubleshoot.yml
    - ../../group_vars/all/demo_platform.yml
  vars:
    demo_platform_artifacts_dir: "{{ playbook_dir }}/../../artifacts"
    demo_platform_artifacts_file: "{{ playbook_dir }}/../../artifacts/demo_platform_facts.yml"
  tasks:
    - name: Check demo platform facts artifact exists
      ansible.builtin.stat:
        path: "{{ demo_platform_artifacts_file }}"
      register: demo_platform_artifacts_stat

    - name: Fail when demo platform facts artifact is missing
      ansible.builtin.fail:
        msg: >-
          artifacts/demo_platform_facts.yml not found. Run playbooks/install.yml first
          to generate platform facts.
      when: not demo_platform_artifacts_stat.stat.exists

    - name: Publish or update ITSM KB article for Apache troubleshoot
      ansible.builtin.import_role:
        name: demo_platform
        tasks_from: configure_itsm_kb_apache_troubleshoot.yml
