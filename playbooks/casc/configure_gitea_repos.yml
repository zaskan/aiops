---
- name: Configure Gitea repositories for AIOps demo
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../group_vars/all/gitea_repos.yml
  vars:
    demo_platform_artifacts_dir: "{{ playbook_dir }}/../../artifacts"
    gitea_repos_local_base: "{{ playbook_dir }}"
  tasks:
    - name: Sync Gitea repositories from configured sources
      ansible.builtin.import_tasks: ../../roles/demo_platform/tasks/configure_gitea_repos.yml
