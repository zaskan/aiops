---
- name: Create ITSM incident from Apache alert
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Load ITSM API credentials
      ansible.builtin.include_role:
        name: common
        tasks_from: load_itsm_credential.yml

    - name: Validate alert extra vars for incident creation
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | string | trim | length > 0
        fail_msg: vm_name extra var is required to create an Apache alert incident.

    - name: Build incident title and description from alert payload
      ansible.builtin.set_fact:
        apache_alert_incident_title: >-
          Apache application down — {{ vm_name | string | trim }}
        apache_alert_incident_description: |-
          Automated incident from Alertmanager alert {{ alertname | default('ApacheApplicationDown') }}.

          vm_name: {{ vm_name | string | trim }}
          probe_instance: {{ probe_instance | default('unknown') }}
          summary: {{ alert_summary | default('Apache HTTP probe failed') }}

          Remediation: confirm in chat, then launch AAP job template "Troubleshoot apache application".

    - name: List open ITSM incidents for idempotency check
      ansible.builtin.uri:
        url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents?status=open"
        method: GET
        force_basic_auth: true
        url_username: "{{ itsm_api_user }}"
        url_password: "{{ itsm_api_password }}"
        validate_certs: "{{ itsm_validate_certs | default(false) }}"
        return_content: true
        status_code: [200]
        headers:
          Accept: application/json
      register: apache_alert_open_incidents

    - name: Detect existing open incident for the same VM alert
      ansible.builtin.set_fact:
        apache_alert_existing_incident: >-
          {{
            (
              apache_alert_open_incidents.json
              | default([])
              | selectattr('title', 'equalto', apache_alert_incident_title)
              | list
              | first
              | default({}, true)
            )
          }}

    - name: Skip incident creation when an open incident already exists
      ansible.builtin.debug:
        msg: >-
          Open incident already exists for {{ vm_name }}:
          {{ apache_alert_existing_incident.public_id | default('unknown') }}
      when: apache_alert_existing_incident.public_id is defined

    - name: Lookup Apache Application asset by VM hostname
      ansible.builtin.uri:
        url: >-
          {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/assets?asset_type={{
          itsm_apache_app_asset_type_name | default('Generic Application') | urlencode
          }}
        method: GET
        force_basic_auth: true
        url_username: "{{ itsm_api_user }}"
        url_password: "{{ itsm_api_password }}"
        validate_certs: "{{ itsm_validate_certs | default(false) }}"
        return_content: true
        status_code: [200]
        headers:
          Accept: application/json
      register: apache_alert_asset_lookup
      when: apache_alert_existing_incident.public_id is not defined

    - name: Resolve inventory asset id for incident linkage
      ansible.builtin.set_fact:
        apache_alert_inventory_asset_id: >-
          {{
            (
              apache_alert_asset_lookup.json
              | default([])
              | selectattr('asset_type_name', 'equalto', itsm_apache_app_asset_type_name | default('Generic Application'))
              | selectattr('custom_fields', 'defined')
              | selectattr('custom_fields.vm_hostname', 'equalto', vm_name | string | trim)
              | list
              | first
              | default({}, true)
            ).id | default(none, true)
          }}
      when: apache_alert_existing_incident.public_id is not defined

    - name: Create ITSM incident for Apache alert
      ansible.builtin.uri:
        url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents"
        method: POST
        force_basic_auth: true
        url_username: "{{ itsm_api_user }}"
        url_password: "{{ itsm_api_password }}"
        validate_certs: "{{ itsm_validate_certs | default(false) }}"
        body_format: json
        body: "{{ apache_alert_incident_body }}"
        status_code: [201]
        return_content: true
        headers:
          Accept: application/json
          Content-Type: application/json
      vars:
        apache_alert_incident_body: >-
          {{
            {
              'title': apache_alert_incident_title,
              'description': apache_alert_incident_description,
              'severity': 'high'
            }
            | combine(
              {'inventory_asset_id': apache_alert_inventory_asset_id | int}
              if apache_alert_inventory_asset_id is defined
              and apache_alert_inventory_asset_id is not none
              else {}
            )
          }}
      register: apache_alert_incident_create
      when: apache_alert_existing_incident.public_id is not defined

    - name: Display created incident reference
      ansible.builtin.debug:
        msg: >-
          ITSM incident {{
            apache_alert_incident_create.json.public_id
            | default(apache_alert_existing_incident.public_id)
          }} created or reused for Apache alert on {{ vm_name }}.
