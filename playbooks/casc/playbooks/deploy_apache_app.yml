---
- name: Start ITSM change task tracking
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Start ITSM CTASK for Deploy Apache App
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: start.yml

    - name: Resolve target host for Apache stack job
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_apache_app_target_host.yml

- name: Deploy Apache application from Gitea repository
  hosts: apache_app_targets
  gather_facts: true
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Clone application repository into Apache docroot
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: deploy

- name: Complete ITSM change task tracking
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Restore application git commit from target host facts
      ansible.builtin.set_fact:
        itsm_app_git_commit: >-
          {{ hostvars[apache_app_target_host]['itsm_app_git_commit'] | default(itsm_app_git_commit | default('')) }}

    - name: Complete ITSM CTASK for Deploy Apache App
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: complete.yml
