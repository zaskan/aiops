---
- name: Run GitOps infrastructure preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Configure Argo CD repository credentials for Infrastructure
  ansible.builtin.include_tasks: repository_secret.yml

- name: Grant Argo CD permission to manage Infrastructure destination namespace
  ansible.builtin.include_tasks: ensure_dest_namespace_rbac.yml

- name: Configure Argo CD Application for Infrastructure VMs
  ansible.builtin.include_tasks: application.yml

- name: Display GitOps infrastructure summary
  ansible.builtin.debug:
    msg:
      - "Argo CD Application: {{ gitops_infrastructure_app_name }}"
      - "Namespace: {{ gitops_infrastructure_app_namespace }}"
      - "Source repo: {{ gitops_infrastructure_repo_url }}"
      - "Source path: {{ gitops_infrastructure_source_path }} (recursive)"
      - "Destination namespace: {{ gitops_infrastructure_dest_namespace }}"
