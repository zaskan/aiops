---
- name: Detect whether OpenShift credentials are injected by AAP
  ansible.builtin.set_fact:
    gitops_infrastructure_use_env_auth: >-
      {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') | default('') | trim | length > 0 }}

- name: Load GitOps infrastructure connection configuration
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure Infrastructure vms source path exists in Gitea for Argo CD
  ansible.builtin.include_tasks: ensure_vms_source_path.yml

- name: Look up Infrastructure VMs Argo CD Application
  kubernetes.core.k8s_info:
    host: "{{ gitops_infrastructure_openshift_api_server | default(omit) }}"
    api_key: "{{ gitops_infrastructure_openshift_token | default(omit) }}"
    validate_certs: "{{ gitops_infrastructure_validate_certs }}"
    kind: Application
    api_version: argoproj.io/v1alpha1
    name: "{{ gitops_infrastructure_app_name }}"
    namespace: "{{ gitops_infrastructure_app_namespace }}"
  register: gitops_infrastructure_app_lookup

- name: Ensure Argo CD repository credentials and Application exist
  when: gitops_infrastructure_app_lookup.resources | default([]) | length == 0
  block:
    - name: Configure Argo CD repository credentials for Infrastructure
      ansible.builtin.include_tasks: repository_secret.yml

    - name: Configure Argo CD Application for Infrastructure VMs
      ansible.builtin.include_tasks: application.yml

- name: Ensure Infrastructure VMs Application sync policy allows empty Git path
  ansible.builtin.include_tasks: ensure_application_sync_policy.yml
  when: gitops_infrastructure_app_lookup.resources | default([]) | length > 0

- name: Trigger Infrastructure VMs Argo CD sync with prune
  ansible.builtin.include_tasks: trigger_application_sync.yml

- name: Wait for Argo CD Application to reach Synced and Healthy state
  kubernetes.core.k8s_info:
    host: "{{ gitops_infrastructure_openshift_api_server | default(omit) }}"
    api_key: "{{ gitops_infrastructure_openshift_token | default(omit) }}"
    validate_certs: "{{ gitops_infrastructure_validate_certs }}"
    kind: Application
    api_version: argoproj.io/v1alpha1
    name: "{{ gitops_infrastructure_app_name }}"
    namespace: "{{ gitops_infrastructure_app_namespace }}"
  register: gitops_infrastructure_app_status
  until: >
    gitops_infrastructure_app_status.resources | default([]) | length > 0
    and (
      gitops_infrastructure_app_status.resources[0].status.sync.status | default('') == 'Synced'
    )
    and (
      gitops_infrastructure_app_status.resources[0].status.health.status | default('') in ['Healthy', 'Progressing']
    )
  retries: 30
  delay: 10

- name: Display Argo CD sync status
  ansible.builtin.debug:
    msg:
      - "Application: {{ gitops_infrastructure_app_name }}"
      - "Sync status: {{ gitops_infrastructure_app_status.resources[0].status.sync.status | default('unknown') }}"
      - "Health status: {{ gitops_infrastructure_app_status.resources[0].status.health.status | default('unknown') }}"
