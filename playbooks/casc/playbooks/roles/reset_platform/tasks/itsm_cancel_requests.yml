---
- name: List active ITSM service requests
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/requests?open_only=1"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: reset_itsm_open_requests

- name: Cancel active ITSM service requests
  ansible.builtin.uri:
    url: >-
      {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/requests/{{
      item.public_id | default(item.request_ref) | urlencode }}/cancel
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: {}
    status_code: [200, 404, 409]
  register: reset_itsm_request_cancel_results
  failed_when: false
  loop: "{{ reset_itsm_open_requests.json | default([]) }}"
  loop_control:
    label: "{{ item.public_id | default(item.request_ref) | default('unknown') }}"

- name: Summarize ITSM service request cancellations
  ansible.builtin.debug:
    msg:
      - "Active requests found: {{ reset_itsm_open_requests.json | default([]) | length }}"
      - >-
        Cancelled: {{
          reset_itsm_request_cancel_results.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | list
          | length
        }}
      - >-
        Skipped or dependency-blocked: {{
          reset_itsm_request_cancel_results.results | default([])
          | selectattr('status', 'defined')
          | rejectattr('status', 'equalto', 200)
          | list
          | length
        }}
