---
- name: List ITSM assets for {{ reset_itsm_asset_type_name }} cleanup
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/assets"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: reset_itsm_assets_list

- name: Build {{ reset_itsm_asset_type_name }} asset ids to delete
  ansible.builtin.set_fact:
    reset_itsm_asset_ids: >-
      {{
        reset_itsm_assets_list.json
        | default([])
        | selectattr('asset_type_name', 'equalto', reset_itsm_asset_type_name)
        | map(attribute='id')
        | list
      }}

- name: Delete {{ reset_itsm_asset_type_name }} assets from ITSM
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/assets/{{ item }}"
    method: DELETE
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    status_code: [200, 204, 404, 409]
  register: reset_itsm_asset_delete_results
  failed_when: false
  loop: "{{ reset_itsm_asset_ids | default([]) }}"
  when: reset_itsm_asset_ids | default([]) | length > 0

- name: Summarize {{ reset_itsm_asset_type_name }} asset deletions
  ansible.builtin.debug:
    msg:
      - "{{ reset_itsm_asset_type_name }} assets found: {{ reset_itsm_asset_ids | default([]) | length }}"
      - >-
        Deleted: {{
          reset_itsm_asset_delete_results.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'in', [200, 204])
          | list
          | length
        }}
      - >-
        Skipped or dependency-blocked: {{
          reset_itsm_asset_delete_results.results | default([])
          | selectattr('status', 'defined')
          | rejectattr('status', 'in', [200, 204])
          | list
          | length
        }}
