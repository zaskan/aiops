---
- name: Require explicit reset confirmation
  ansible.builtin.assert:
    that:
      - reset_confirm is defined
      - reset_confirm | bool
    fail_msg: >-
      Platform reset is destructive. Re-run with -e reset_confirm=true or launch the Reset
      job template from AAP.

- name: Load ITSM credentials
  ansible.builtin.include_role:
    name: common
    tasks_from: load_itsm_credential.yml

- name: Load Gitea credentials
  ansible.builtin.include_role:
    name: common
    tasks_from: load_gitea_credential.yml

- name: Load AAP controller credentials
  ansible.builtin.include_role:
    name: common
    tasks_from: load_aap_controller_credential.yml

- name: Load chat-app credentials
  ansible.builtin.include_role:
    name: common
    tasks_from: load_chat_credential.yml

- name: Obtain AAP gateway OAuth token for reset automation
  ansible.builtin.uri:
    url: "{{ aap_controller_host }}/api/gateway/v1/tokens/"
    method: POST
    user: "{{ aap_controller_username }}"
    password: "{{ aap_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ reset_validate_certs }}"
    body_format: json
    body:
      description: reset-platform ansible automation
      scope: write
    status_code: 201
  register: reset_gateway_token_create
  no_log: true

- name: Set AAP controller OAuth token fact for reset automation
  ansible.builtin.set_fact:
    reset_controller_oauthtoken: "{{ reset_gateway_token_create.json.token }}"
  no_log: true

- name: Resolve local demo platform facts artifact path for chat admin fallback
  ansible.builtin.set_fact:
    reset_chat_admin_artifact_file: >-
      {{ reset_chat_admin_artifacts_file | default(playbook_dir ~ '/../../../artifacts/demo_platform_facts.yml', true) }}

- name: Check demo platform facts artifact exists for chat admin fallback
  ansible.builtin.stat:
    path: "{{ reset_chat_admin_artifact_file }}"
  register: reset_chat_admin_artifact_stat

- name: Load demo platform facts from artifact for chat admin fallback
  ansible.builtin.include_vars:
    file: "{{ reset_chat_admin_artifact_file }}"
  when: reset_chat_admin_artifact_stat.stat.exists | default(false)

- name: Set chat admin credentials from artifact
  ansible.builtin.set_fact:
    reset_chat_admin_username: "{{ demo_platform.chat_app.username }}"
    reset_chat_admin_password: "{{ demo_platform.chat_app.password }}"
  when: demo_platform is defined
  no_log: true

- name: Fall back to injected chat credentials for admin login
  ansible.builtin.set_fact:
    reset_chat_admin_username: "{{ chat_app_username }}"
    reset_chat_admin_password: "{{ chat_app_password }}"
  when:
    - reset_chat_admin_username is not defined or reset_chat_admin_username | string | trim | length == 0
    - chat_app_username is defined
    - chat_app_username | string | trim | length > 0
  no_log: true

- name: Normalize chat API base URL for reset
  ansible.builtin.set_fact:
    reset_chat_api_base_url: "{{ chat_app_url | regex_replace('/$', '') }}"
