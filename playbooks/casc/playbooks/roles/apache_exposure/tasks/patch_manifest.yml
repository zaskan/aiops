---
- name: Set Gitea host for authenticated git clone
  ansible.builtin.set_fact:
    apache_exposure_gitea_host: >-
      {{ apache_exposure_gitea_api_base | regex_replace('^https?://', '') | regex_replace('/$', '') }}

- name: Build authenticated Gitea clone URL for Infrastructure repository
  ansible.builtin.set_fact:
    apache_exposure_gitea_clone_repo: >-
      {{
        (
          'http://'
          ~ apache_exposure_gitea_username | urlencode ~ ':'
          ~ apache_exposure_gitea_password | urlencode ~ '@'
          ~ apache_exposure_gitea_internal_host ~ '/'
          ~ apache_exposure_gitea_owner | urlencode ~ '/'
          ~ apache_exposure_gitea_repo | urlencode ~ '.git'
        )
        if (apache_exposure_gitea_use_internal | default(false) | bool)
        else (
          'https://'
          ~ apache_exposure_gitea_username | urlencode ~ ':'
          ~ apache_exposure_gitea_password | urlencode ~ '@'
          ~ apache_exposure_gitea_host ~ '/'
          ~ apache_exposure_gitea_owner | urlencode ~ '/'
          ~ apache_exposure_gitea_repo | urlencode ~ '.git'
        )
      }}
  no_log: true

- name: Remove temporary Infrastructure clone directory
  ansible.builtin.file:
    path: "{{ apache_exposure_workdir }}/repo"
    state: absent

- name: Clone Gitea Infrastructure repository
  ansible.builtin.git:
    repo: "{{ apache_exposure_gitea_clone_repo }}"
    dest: "{{ apache_exposure_workdir }}/repo"
    version: "{{ apache_exposure_gitea_branch }}"
    single_branch: true
    force: true
  environment:
    GIT_SSL_NO_VERIFY: >-
      {{
        'false'
        if (
          apache_exposure_gitea_use_internal | default(false) | bool
          or apache_exposure_validate_certs | bool
        )
        else 'true'
      }}
  no_log: true

- name: Set path to VM manifest in Infrastructure repository
  ansible.builtin.set_fact:
    apache_exposure_manifest_path: >-
      {{ apache_exposure_workdir }}/repo/{{ apache_exposure_gitea_path }}/{{ apache_exposure_vm_name }}.yaml

- name: Fail when VM manifest does not exist in Infrastructure repository
  ansible.builtin.stat:
    path: "{{ apache_exposure_manifest_path }}"
  register: apache_exposure_manifest_stat

- name: Abort when VM manifest is missing from GitOps repository
  ansible.builtin.fail:
    msg: >-
      VM manifest {{ apache_exposure_gitea_path }}/{{ apache_exposure_vm_name }}.yaml was not found
      in Gitea Infrastructure. Run Provision VM (Push VM Manifest) before Expose Apache.
  when: not apache_exposure_manifest_stat.stat.exists

- name: Read current VM manifest content from repository clone
  ansible.builtin.slurp:
    src: "{{ apache_exposure_manifest_path }}"
  register: apache_exposure_manifest_slurp

- name: Capture VM manifest content as plain text
  ansible.builtin.set_fact:
    apache_exposure_manifest_content: "{{ apache_exposure_manifest_slurp.content | b64decode }}"

- name: Parse VM manifest documents from GitOps file
  ansible.builtin.set_fact:
    apache_exposure_manifest_docs: >-
      {{
        apache_exposure_manifest_content
        | from_yaml_all
        | list
        | select('mapping')
        | list
      }}

- name: Resolve VirtualMachine document from parsed manifest
  ansible.builtin.set_fact:
    apache_exposure_vm_doc: >-
      {{
        apache_exposure_manifest_docs
        | selectattr('kind', 'equalto', 'VirtualMachine')
        | list
        | first
        | default({}, true)
      }}

- name: Determine whether VirtualMachine manifest exposes the configured service port
  ansible.builtin.set_fact:
    apache_exposure_vm_has_service_port: >-
      {{
        (
          apache_exposure_vm_doc.spec.template.spec.domain.devices.interfaces
          | default([])
          | first
          | default({})
        ).ports
        | default([])
        | selectattr('port', 'equalto', apache_exposure_service_port | int)
        | list
        | length > 0
      }}

- name: Repair malformed masquerade port indentation in VM manifest
  ansible.builtin.replace:
    path: "{{ apache_exposure_manifest_path }}"
    regexp: |-
      (              ports:
                - port: 22
                  protocol: TCP)
          - port: {{ apache_exposure_service_port | int }}
            protocol: TCP
    replace: '\1\n                - port: {{ apache_exposure_service_port | int }}\n                  protocol: TCP'
  when: apache_exposure_malformed_port_line in apache_exposure_manifest_content

- name: Ensure configured masquerade port is present on VirtualMachine manifest
  ansible.builtin.replace:
    path: "{{ apache_exposure_manifest_path }}"
    regexp: |-
      (              ports:
                - port: 22
                  protocol: TCP)
    replace: '\1\n                - port: {{ apache_exposure_service_port | int }}\n                  protocol: TCP'
  when: not apache_exposure_vm_has_service_port | bool

- name: Re-read VM manifest after port patching
  ansible.builtin.slurp:
    src: "{{ apache_exposure_manifest_path }}"
  register: apache_exposure_manifest_slurp
  when: >-
    not apache_exposure_vm_has_service_port | bool
    or apache_exposure_malformed_port_line in apache_exposure_manifest_content

- name: Refresh VM manifest content fact after port patching
  ansible.builtin.set_fact:
    apache_exposure_manifest_content: "{{ apache_exposure_manifest_slurp.content | b64decode }}"
    apache_exposure_manifest_docs: >-
      {{
        (apache_exposure_manifest_slurp.content | b64decode)
        | from_yaml_all
        | list
        | select('mapping')
        | list
      }}
  when: >-
    not apache_exposure_vm_has_service_port | bool
    or apache_exposure_malformed_port_line in apache_exposure_manifest_content

- name: Repair incorrect KubeVirt Service selector in existing Apache exposure manifest
  ansible.builtin.replace:
    path: "{{ apache_exposure_manifest_path }}"
    regexp: 'kubevirt\.io/domain: {{ apache_exposure_vm_name }}'
    replace: 'vm.kubevirt.io/name: {{ apache_exposure_vm_name }}'
  when: "{{ 'kubevirt.io/domain:' in apache_exposure_manifest_content }}"

- name: Re-read VM manifest after Service selector repair
  ansible.builtin.slurp:
    src: "{{ apache_exposure_manifest_path }}"
  register: apache_exposure_manifest_slurp
  when: "{{ 'kubevirt.io/domain:' in apache_exposure_manifest_content }}"

- name: Refresh VM manifest content fact after Service selector repair
  ansible.builtin.set_fact:
    apache_exposure_manifest_content: "{{ apache_exposure_manifest_slurp.content | b64decode }}"
    apache_exposure_manifest_docs: >-
      {{
        (apache_exposure_manifest_slurp.content | b64decode)
        | from_yaml_all
        | list
        | select('mapping')
        | list
      }}
  when: "{{ 'kubevirt.io/domain:' in apache_exposure_manifest_content }}"

- name: Detect legacy HTTP Probe document in GitOps manifest
  ansible.builtin.set_fact:
    apache_exposure_has_probe_in_gitops: >-
      {{
        (
          apache_exposure_manifest_docs
          | selectattr('kind', 'equalto', 'Probe')
          | map(attribute='metadata')
          | selectattr('name', 'equalto', apache_exposure_vm_name ~ '-http-probe')
          | list
          | length
        ) > 0
      }}

- name: Initialize manifest documents without legacy HTTP Probe
  ansible.builtin.set_fact:
    apache_exposure_manifest_docs_stripped: []
  when: apache_exposure_has_probe_in_gitops | bool

- name: Collect manifest documents excluding legacy HTTP Probe
  ansible.builtin.set_fact:
    apache_exposure_manifest_docs_stripped: >-
      {{ apache_exposure_manifest_docs_stripped + [item] }}
  loop: "{{ apache_exposure_manifest_docs }}"
  when:
    - apache_exposure_has_probe_in_gitops | bool
    - >-
      not (
        item.kind | default('') == 'Probe'
        and (item.metadata.name | default('')) == apache_exposure_vm_name ~ '-http-probe'
      )

- name: Rewrite GitOps manifest without legacy HTTP Probe document
  ansible.builtin.copy:
    dest: "{{ apache_exposure_manifest_path }}"
    mode: "0644"
    content: |
      {{ apache_exposure_manifest_docs_stripped | map('to_nice_yaml', indent=2) | join('---\n') }}
  when: apache_exposure_has_probe_in_gitops | bool

- name: Re-read VM manifest after stripping legacy HTTP Probe
  ansible.builtin.slurp:
    src: "{{ apache_exposure_manifest_path }}"
  register: apache_exposure_manifest_slurp
  when: apache_exposure_has_probe_in_gitops | bool

- name: Refresh VM manifest content fact after stripping legacy HTTP Probe
  ansible.builtin.set_fact:
    apache_exposure_manifest_content: "{{ apache_exposure_manifest_slurp.content | b64decode }}"
    apache_exposure_manifest_docs: >-
      {{
        (apache_exposure_manifest_slurp.content | b64decode)
        | from_yaml_all
        | list
        | select('mapping')
        | list
      }}
  when: apache_exposure_has_probe_in_gitops | bool

- name: Detect whether Service manifest is already present in VM manifest file
  ansible.builtin.set_fact:
    apache_exposure_has_service: >-
      {{
        (
          apache_exposure_manifest_docs
          | selectattr('kind', 'equalto', 'Service')
          | map(attribute='metadata')
          | selectattr('name', 'equalto', apache_exposure_service_name)
          | list
          | length
        ) > 0
      }}

- name: Detect whether Route manifest is already present in VM manifest file
  ansible.builtin.set_fact:
    apache_exposure_has_route: >-
      {{
        (
          apache_exposure_manifest_docs
          | selectattr('kind', 'equalto', 'Route')
          | map(attribute='metadata')
          | selectattr('name', 'equalto', apache_exposure_route_name)
          | list
          | length
        ) > 0
      }}

- name: Render Service and Route manifest fragments for Apache exposure
  ansible.builtin.template:
    src: apache_exposure_append.yaml.j2
    dest: "{{ apache_exposure_workdir }}/append.yaml"
    mode: "0640"
  when: not apache_exposure_has_service | bool

- name: Append Service and Route documents to VM manifest file
  ansible.builtin.shell: |
    set -euo pipefail
    printf '\n---\n' >> "{{ apache_exposure_manifest_path }}"
    cat "{{ apache_exposure_workdir }}/append.yaml" >> "{{ apache_exposure_manifest_path }}"
  when: not apache_exposure_has_service | bool
  changed_when: true

- name: Render Route manifest fragment when Service exists without Route
  ansible.builtin.template:
    src: apache_exposure_route.yaml.j2
    dest: "{{ apache_exposure_workdir }}/append-route.yaml"
    mode: "0640"
  when:
    - apache_exposure_has_service | bool
    - not apache_exposure_has_route | bool

- name: Append Route document to VM manifest file
  ansible.builtin.shell: |
    set -euo pipefail
    printf '\n---\n' >> "{{ apache_exposure_manifest_path }}"
    cat "{{ apache_exposure_workdir }}/append-route.yaml" >> "{{ apache_exposure_manifest_path }}"
  when:
    - apache_exposure_has_service | bool
    - not apache_exposure_has_route | bool
  changed_when: true
