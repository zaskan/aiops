---
- name: Build enabled services list from comma-separated services field
  ansible.builtin.set_fact:
    apache_app_enabled_service_list: >-
      {{
        (
          apache_troubleshoot_runtime_apache_app_enabled_services
          | default(apache_app_enabled_services | default(apache_app_service, true), true)
          | split(',')
          | map('trim')
          | reject('equalto', '')
          | list
        )
      }}

- name: Enable and start application services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ apache_app_enabled_service_list }}"

- name: Wait for http service on localhost when httpd is an enabled service
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: [200, 403, 301, 302]
  register: apache_app_http_check
  until: apache_app_http_check.status in [200, 403, 301, 302]
  retries: 12
  delay: 5
  when: "'httpd' in apache_app_enabled_service_list"
