---
- name: Ensure Argo CD repository secret for Gitea Observability exists
  kubernetes.core.k8s:
    state: present
    host: "{{ gitops_observability_openshift_api_server | default(omit) }}"
    api_key: "{{ gitops_observability_openshift_token | default(omit) }}"
    validate_certs: "{{ gitops_observability_validate_certs }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitops_observability_repo_secret_name }}"
        namespace: "{{ gitops_observability_app_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: "{{ gitops_observability_repo_url }}"
        username: "{{ gitops_observability_gitea_username }}"
        password: "{{ gitops_observability_gitea_password }}"
        insecure: "{{ gitops_observability_gitea_insecure | bool | ternary('true', 'false') }}"
  no_log: true
