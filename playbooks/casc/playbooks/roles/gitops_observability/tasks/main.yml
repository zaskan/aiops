---
- name: Run GitOps observability preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Configure Argo CD repository credentials for Observability
  ansible.builtin.include_tasks: repository_secret.yml

- name: Configure Argo CD Application for Observability stack
  ansible.builtin.include_tasks: application.yml

- name: Display GitOps observability summary
  ansible.builtin.debug:
    msg:
      - "Argo CD Application: {{ gitops_observability_app_name }}"
      - "Namespace: {{ gitops_observability_app_namespace }}"
      - "Source repo: {{ gitops_observability_repo_url }}"
      - "Source path: {{ gitops_observability_source_path }} (recursive)"
      - "Destination namespace: {{ gitops_observability_dest_namespace }}"
