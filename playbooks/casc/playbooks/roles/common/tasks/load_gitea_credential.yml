---
- name: Resolve Gitea URL from AAP credential injection
  ansible.builtin.set_fact:
    gitea_credential_url: "{{ gitea_url }}"
    gitea_credential_username: "{{ gitea_username }}"
    gitea_credential_password: "{{ gitea_password }}"
  when: gitea_url is defined
  no_log: true

- name: Resolve local demo platform facts artifact path for Gitea fallback
  ansible.builtin.set_fact:
    gitea_credential_artifact_file: >-
      {{ gitea_credential_artifacts_file | default(playbook_dir ~ '/../../../artifacts/demo_platform_facts.yml', true) }}
  when: gitea_url is not defined

- name: Load Gitea connection facts from local artifact when credential is not injected
  when: gitea_url is not defined
  block:
    - name: Check demo platform facts artifact exists for Gitea fallback
      ansible.builtin.stat:
        path: "{{ gitea_credential_artifact_file }}"
      register: gitea_credential_artifact_stat

    - name: Load demo platform facts from artifact for Gitea fallback
      ansible.builtin.include_vars:
        file: "{{ gitea_credential_artifact_file }}"
      when: gitea_credential_artifact_stat.stat.exists | default(false)

    - name: Set Gitea connection facts from local artifact
      ansible.builtin.set_fact:
        gitea_credential_url: "{{ demo_platform.gitea.url }}"
        gitea_credential_username: "{{ demo_platform.gitea.username }}"
        gitea_credential_password: "{{ demo_platform.gitea.password }}"
      when: demo_platform is defined
      no_log: true

- name: Normalize Gitea URL hostname
  ansible.builtin.set_fact:
    gitea_credential_url: >-
      {{
        gitea_credential_url
        | replace('.apps.apps.', '.apps.')
        | regex_replace('/$', '')
      }}
  when: gitea_credential_url is defined

- name: Fail when Gitea connection facts could not be resolved
  ansible.builtin.fail:
    msg: >-
      Gitea connection facts are missing. Attach the Gitea credential in AAP, pass
      -e gitea_url/gitea_username/gitea_password, or run from the repo root with
      artifacts/demo_platform_facts.yml present for local fallback.
  when: gitea_credential_url is not defined

- name: Map resolved Gitea facts to vm_manifest variables
  ansible.builtin.set_fact:
    vm_manifest_gitea_api_base: "{{ gitea_credential_url }}"
    vm_manifest_gitea_username: "{{ gitea_credential_username }}"
    vm_manifest_gitea_password: "{{ gitea_credential_password }}"
    vm_manifest_gitea_owner: "{{ gitea_credential_username }}"
  no_log: true

- name: Map resolved Gitea facts to gitops_infrastructure variables
  ansible.builtin.set_fact:
    gitops_infrastructure_gitea_api_base: "{{ gitea_credential_url }}"
    gitops_infrastructure_gitea_username: "{{ gitea_credential_username }}"
    gitops_infrastructure_gitea_password: "{{ gitea_credential_password }}"
    gitops_infrastructure_gitea_owner: "{{ gitea_credential_username }}"
  no_log: true
