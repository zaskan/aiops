---
- name: Load OpenShift API credentials for VM restart
  ansible.builtin.include_tasks: load_openshift_credential.yml

- name: Look up VirtualMachine manifest for expected resources
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_restart_name }}"
    namespace: "{{ vm_restart_namespace | default(vm_namespace) }}"
  register: vm_restart_vm_lookup

- name: Resolve expected CPU cores from VirtualMachine when not supplied
  ansible.builtin.set_fact:
    vm_restart_expected_cpus: >-
      {{
        vm_restart_vm_lookup.resources[0].spec.template.spec.domain.cpu.cores
        | default(vm_restart_expected_cpus | default(omit))
      }}
  when:
    - vm_restart_vm_lookup.resources | default([]) | length > 0
    - vm_restart_expected_cpus is not defined or vm_restart_expected_cpus | string | trim | length == 0

- name: Resolve expected memory from VirtualMachine when not supplied
  ansible.builtin.set_fact:
    vm_restart_expected_mem: >-
      {{
        vm_restart_vm_lookup.resources[0].spec.template.spec.domain.resources.requests.memory
        | default(vm_restart_expected_mem | default(omit))
        | regex_replace('Gi$', '')
      }}
  when:
    - vm_restart_vm_lookup.resources | default([]) | length > 0
    - vm_restart_expected_mem is not defined or vm_restart_expected_mem | string | trim | length == 0

- name: Look up VirtualMachineInstance before restart
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ vm_restart_name }}"
    namespace: "{{ vm_restart_namespace | default(vm_namespace) }}"
  register: vm_restart_vmi_before
  failed_when: false

- name: Record VMI identity before restart when instance is running
  ansible.builtin.set_fact:
    vm_restart_vmi_revision_before: >-
      {{
        vm_restart_vmi_before.resources[0].status.virtualMachineRevisionName
        | default('')
      }}
    vm_restart_vmi_uid_before: >-
      {{ vm_restart_vmi_before.resources[0].metadata.uid | default('') }}
  when: vm_restart_vmi_before.resources | default([]) | length > 0

- name: Restart VM via KubeVirt restart subresource
  ansible.builtin.uri:
    url: >-
      {{ openshift_credential_host | default('https://kubernetes.default.svc') }}/apis/subresources.kubevirt.io/v1/namespaces/{{ vm_restart_namespace | default(vm_namespace) }}/virtualmachines/{{ vm_restart_name }}/restart
    method: PUT
    headers:
      Authorization: "Bearer {{ openshift_credential_token | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY')) }}"
      Content-Type: application/json
    body_format: json
    body: {}
    validate_certs: false
    status_code: [200, 202, 204]

- name: Wait for VM restart to complete with Running VMI
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ vm_restart_name }}"
    namespace: "{{ vm_restart_namespace | default(vm_namespace) }}"
  register: vm_restart_vmi_wait
  until: >-
    vm_restart_vmi_wait.resources | default([]) | length > 0
    and vm_restart_vmi_wait.resources[0].status.phase | default('') == 'Running'
    and (
      vm_restart_vmi_before.resources | default([]) | length == 0
      or (
        vm_restart_vmi_uid_before | default('') | length > 0
        and (
          vm_restart_vmi_wait.resources[0].metadata.uid | default('')
          != vm_restart_vmi_uid_before
        )
      )
      or (
        vm_restart_vmi_revision_before | default('') | length > 0
        and (
          vm_restart_vmi_wait.resources[0].status.virtualMachineRevisionName | default('')
          != vm_restart_vmi_revision_before
        )
      )
    )
  retries: "{{ vm_restart_wait_retries | default(36) }}"
  delay: "{{ vm_restart_wait_delay | default(10) }}"

- name: Record that VM was restarted
  ansible.builtin.set_fact:
    vm_restart_completed: true
