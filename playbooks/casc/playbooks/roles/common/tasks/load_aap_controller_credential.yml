---
- name: Resolve AAP controller connection from credential injection
  ansible.builtin.set_fact:
    aap_controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST', default='') }}"
    aap_controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME', default='') }}"
    aap_controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD', default='') }}"
  when: lookup('ansible.builtin.env', 'CONTROLLER_HOST', default='') | length > 0
  no_log: true

- name: Resolve local demo platform facts artifact path for AAP controller fallback
  ansible.builtin.set_fact:
    aap_controller_artifact_file: >-
      {{ aap_controller_artifacts_file | default(playbook_dir ~ '/../../../artifacts/demo_platform_facts.yml', true) }}
  when: aap_controller_host is not defined or aap_controller_host | length == 0

- name: Load AAP controller connection facts from local artifact when credential is not injected
  when: aap_controller_host is not defined or aap_controller_host | length == 0
  block:
    - name: Check demo platform facts artifact exists for AAP controller fallback
      ansible.builtin.stat:
        path: "{{ aap_controller_artifact_file }}"
      register: aap_controller_artifact_stat

    - name: Load demo platform facts from artifact for AAP controller fallback
      ansible.builtin.include_vars:
        file: "{{ aap_controller_artifact_file }}"
      when: aap_controller_artifact_stat.stat.exists | default(false)

    - name: Set AAP controller connection facts from local artifact
      ansible.builtin.set_fact:
        aap_controller_host: "{{ demo_platform.aap.gateway_url }}"
        aap_controller_username: "{{ demo_platform.aap.username }}"
        aap_controller_password: "{{ demo_platform.aap.password }}"
      when: demo_platform is defined
      no_log: true

- name: Fail when AAP controller connection facts could not be resolved
  ansible.builtin.fail:
    msg: >-
      AAP controller connection facts are missing. Attach the AAP Gateway credential in AAP,
      or run from the repo root with artifacts/demo_platform_facts.yml present for local fallback.
  when: aap_controller_host is not defined or aap_controller_host | length == 0
