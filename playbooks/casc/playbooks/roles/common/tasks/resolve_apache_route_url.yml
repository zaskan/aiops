---
- name: Load OpenShift API credentials for Route lookup
  ansible.builtin.include_tasks: load_openshift_credential.yml

- name: Set Route lookup name from resolved VM hostname
  ansible.builtin.set_fact:
    apache_route_lookup_name: >-
      {{
        apache_exposure_route_name | default('')
        if apache_exposure_route_name is defined and apache_exposure_route_name | string | trim | length > 0
        else (
          itsm_apache_app_target_host | default(apache_exposure_vm_name | default(vm_name | default('')))
          | string | trim
        ) ~ '-http'
      }}
    apache_route_lookup_namespace: "{{ vm_namespace }}"
    apache_route_lookup_vm_name: >-
      {{ itsm_apache_app_target_host | default(apache_exposure_vm_name | default(vm_name | default(''))) }}

- name: Wait for Apache Route to be created by Argo CD
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ apache_route_lookup_name }}"
    namespace: "{{ apache_route_lookup_namespace }}"
  register: apache_route_lookup
  until: >
    apache_route_lookup.resources | default([]) | length > 0
    and apache_route_lookup.resources[0].spec.host | default('') | string | trim | length > 0
  retries: "{{ apache_exposure_route_wait_retries | default(30) }}"
  delay: "{{ apache_exposure_route_wait_delay | default(10) }}"

- name: Build Apache application Route URL from OpenShift Route host
  ansible.builtin.set_fact:
    apache_app_route_url: "https://{{ apache_route_lookup.resources[0].spec.host | trim }}/"
    itsm_apache_app_route_url: "https://{{ apache_route_lookup.resources[0].spec.host | trim }}/"

- name: Display resolved Apache Route URL
  ansible.builtin.debug:
    msg: "Apache Route URL for {{ apache_route_lookup_vm_name }}: {{ apache_app_route_url }}"
