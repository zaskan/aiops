---
- name: Create Alertmanager silence for Generic Application maintenance via amtool
  kubernetes.core.k8s_exec:
    namespace: "{{ openshift_generic_app_monitoring_uwm_alertmanager_namespace }}"
    pod: "{{ generic_app_alert_am_pod_name }}"
    container: "{{ openshift_generic_app_monitoring_uwm_alertmanager_container }}"
    command: >-
      amtool --alertmanager.url=http://127.0.0.1:9093 silence add
      alertname={{ openshift_generic_app_monitoring_alert_name | default('GenericApplicationDown') }}
      vm_name={{ vm_name | string | trim }}
      --duration={{ generic_app_alert_silence_duration_minutes | default(openshift_generic_app_monitoring_delete_silence_minutes | default(5)) | int }}m
      --author={{ generic_app_alert_silence_author | default('aiops-automation') }}
      --comment="{{ generic_app_alert_silence_comment | default('Suppress Generic Application alerts during maintenance for ' ~ (vm_name | string | trim)) }}"
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
  register: generic_app_alert_silence_create
  changed_when: generic_app_alert_silence_create.rc == 0

- name: Record Alertmanager silence id
  ansible.builtin.set_fact:
    generic_app_alert_silence_id: "{{ generic_app_alert_silence_create.stdout | default('') | trim }}"

- name: Display Alertmanager silence summary
  ansible.builtin.debug:
    msg: >-
      Alertmanager silence {{ generic_app_alert_silence_id | default('unknown') }}
      active for {{ generic_app_alert_silence_duration_minutes | default(openshift_generic_app_monitoring_delete_silence_minutes | default(5)) }}m
      on vm_name {{ vm_name | string | trim }}.
