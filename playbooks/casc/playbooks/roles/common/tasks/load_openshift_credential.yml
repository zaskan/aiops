---
- name: Detect whether OpenShift credentials are injected by AAP
  ansible.builtin.set_fact:
    openshift_credential_use_env_auth: >-
      {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') | default('') | trim | length > 0 }}

- name: Set OpenShift connection facts from AAP injected environment
  ansible.builtin.set_fact:
    openshift_credential_host: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | default('', true) | trim }}"
    openshift_credential_token: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') | default('', true) | trim }}"
  when: openshift_credential_use_env_auth | bool
  no_log: true

- name: Resolve local demo platform facts artifact path for OpenShift fallback
  ansible.builtin.set_fact:
    openshift_credential_artifact_file: >-
      {{ openshift_credential_artifacts_file | default(playbook_dir ~ '/../../../artifacts/demo_platform_facts.yml', true) }}
  when: not openshift_credential_use_env_auth | bool

- name: Load OpenShift connection facts from local artifact when credential is not injected
  when: not openshift_credential_use_env_auth | bool
  block:
    - name: Check demo platform facts artifact exists for OpenShift fallback
      ansible.builtin.stat:
        path: "{{ openshift_credential_artifact_file }}"
      register: openshift_credential_artifact_stat

    - name: Load demo platform facts from artifact for OpenShift fallback
      ansible.builtin.include_vars:
        file: "{{ openshift_credential_artifact_file }}"
      when: openshift_credential_artifact_stat.stat.exists | default(false)

    - name: Set OpenShift connection facts from local artifact
      ansible.builtin.set_fact:
        openshift_credential_host: "{{ demo_platform.openshift.api_server }}"
        openshift_credential_token: "{{ demo_platform.openshift.token }}"
      when: demo_platform is defined
      no_log: true

- name: Fail when OpenShift connection facts could not be resolved
  ansible.builtin.fail:
    msg: >-
      OpenShift connection facts are missing. Attach the OpenShift Cluster credential in AAP,
      or run from the repo root with artifacts/demo_platform_facts.yml present for local fallback.
  when:
    - not openshift_credential_use_env_auth | bool
    - openshift_credential_host is not defined or openshift_credential_token is not defined
