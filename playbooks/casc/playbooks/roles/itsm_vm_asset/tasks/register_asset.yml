---
- name: GET ITSM asset types
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/asset-types"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: itsm_vm_asset_types_list

- name: Resolve Virtual Machine asset type id
  ansible.builtin.set_fact:
    itsm_vm_asset_type_id: >-
      {{
        (
          itsm_vm_asset_types_list.json
          | default([])
          | selectattr('name', 'equalto', itsm_vm_asset_type_name)
          | list
          | first
          | default({})
        ).id | default(none)
      }}

- name: Fail when Virtual Machine asset type is missing in ITSM
  ansible.builtin.fail:
    msg: >-
      ITSM asset type '{{ itsm_vm_asset_type_name }}' was not found. Run playbooks/install.yml
      to create asset types before registering VM assets.
  when: itsm_vm_asset_type_id is none

- name: GET existing ITSM assets
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/assets"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: itsm_vm_asset_existing_list

- name: Determine whether VM asset already exists in ITSM
  ansible.builtin.set_fact:
    itsm_vm_asset_existing: >-
      {{
        (
          itsm_vm_asset_existing_list.json
          | default([])
          | selectattr('name', 'equalto', vm_name)
          | list
          | first
          | default({})
        )
      }}
    itsm_vm_asset_already_exists: >-
      {{
        (
          itsm_vm_asset_existing_list.json
          | default([])
          | selectattr('name', 'equalto', vm_name)
          | list
          | length
        ) > 0
      }}

- name: Build Virtual Machine asset custom fields payload
  ansible.builtin.set_fact:
    itsm_vm_asset_custom_fields:
      hostname: "{{ vm_name }}"
      ip_address: "{{ itsm_vm_asset_ip }}"
      ansible_host: "{{ itsm_vm_asset_ansible_host }}"
      cpus: "{{ vm_asset_resolved_cpus | int }}"
      memory: "{{ vm_asset_resolved_mem | int }}"

- name: Create VM asset in ITSM
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/assets"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    body_format: json
    body:
      name: "{{ vm_name }}"
      description: "IP: {{ itsm_vm_asset_ip }}"
      external_inventory: true
      asset_type_id: "{{ itsm_vm_asset_type_id | int }}"
      custom_fields: "{{ itsm_vm_asset_custom_fields }}"
    status_code: [201]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_vm_asset_create
  when: not itsm_vm_asset_already_exists | bool

- name: Update existing VM asset custom fields in ITSM
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/assets/{{ itsm_vm_asset_existing.id }}"
    method: PATCH
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    body_format: json
    body:
      description: "IP: {{ itsm_vm_asset_ip }}"
      custom_fields: "{{ itsm_vm_asset_custom_fields }}"
    status_code: [200]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_vm_asset_update
  when: itsm_vm_asset_already_exists | bool

- name: Display ITSM VM asset registration result
  ansible.builtin.debug:
    msg: >-
      {{
        'Created ITSM asset ' ~ vm_name ~ ' (' ~ itsm_vm_asset_ip ~ ')'
        if not itsm_vm_asset_already_exists | bool
        else 'Updated ITSM asset ' ~ vm_name ~ ' (' ~ itsm_vm_asset_ip ~ ')'
      }}
