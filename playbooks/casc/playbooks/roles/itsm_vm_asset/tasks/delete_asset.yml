---
- name: Validate vm_name for VM ITSM asset deletion
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_name | string | trim | length > 0
    fail_msg: vm_name is required to delete the Virtual Machine ITSM asset.

- name: Load ITSM API credentials for VM asset deletion
  ansible.builtin.include_tasks: load_itsm_credential.yml

- name: GET ITSM assets for Virtual Machine asset lookup
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/assets"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: itsm_vm_asset_delete_list

- name: Resolve Virtual Machine ITSM asset by name
  ansible.builtin.set_fact:
    itsm_vm_asset_delete_record: >-
      {{
        (
          itsm_vm_asset_delete_list.json
          | default([])
          | selectattr('name', 'equalto', vm_name | string | trim)
          | list
          | first
          | default({}, true)
        )
      }}

- name: Skip Virtual Machine asset deletion when asset was not found
  ansible.builtin.debug:
    msg: >-
      No ITSM Virtual Machine asset named '{{ vm_name | string | trim }}' was found;
      skipping asset delete.
  when: itsm_vm_asset_delete_record.id is not defined

- name: Clear ITSM incident references to Virtual Machine asset
  ansible.builtin.include_tasks: ../../common/tasks/clear_itsm_asset_incident_references.yml
  vars:
    itsm_asset_id: "{{ itsm_vm_asset_delete_record.id }}"
  when: itsm_vm_asset_delete_record.id is defined

- name: Delete Virtual Machine ITSM asset
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/assets/{{ itsm_vm_asset_delete_record.id }}"
    method: DELETE
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs | default(false) }}"
    status_code: [204, 404]
  register: itsm_vm_asset_delete_result
  when: itsm_vm_asset_delete_record.id is defined

- name: Display Virtual Machine ITSM asset deletion summary
  ansible.builtin.debug:
    msg: >-
      {{
        'Deleted ITSM Virtual Machine asset ' ~ (vm_name | string | trim)
        if itsm_vm_asset_delete_record.id is defined
        else 'Virtual Machine ITSM asset already absent for ' ~ (vm_name | string | trim)
      }}

- name: Sync AIOps Infrastructure inventory from ITSM after VM asset deletion
  ansible.builtin.include_tasks: sync_inventory.yml
