---
- name: Normalize ITSM validate certs when credential is injected
  ansible.builtin.set_fact:
    itsm_validate_certs: false
  when: itsm_api_base_url is defined

- name: Resolve local demo platform facts artifact path for ITSM fallback
  ansible.builtin.set_fact:
    itsm_credential_artifact_file: >-
      {{ itsm_credential_artifacts_file | default(playbook_dir ~ '/../../../artifacts/demo_platform_facts.yml', true) }}
  when: itsm_api_base_url is not defined

- name: Load ITSM connection facts from local artifact when credential is not injected
  when: itsm_api_base_url is not defined
  block:
    - name: Check demo platform facts artifact exists for ITSM fallback
      ansible.builtin.stat:
        path: "{{ itsm_credential_artifact_file }}"
      register: itsm_credential_artifact_stat

    - name: Load demo platform facts from artifact for ITSM fallback
      ansible.builtin.include_vars:
        file: "{{ itsm_credential_artifact_file }}"
      when: itsm_credential_artifact_stat.stat.exists | default(false)

    - name: Set ITSM connection facts from local artifact
      ansible.builtin.set_fact:
        itsm_api_base_url: "{{ demo_platform.itsm_app.url }}"
        itsm_api_user: "{{ demo_platform.itsm_app.username }}"
        itsm_api_password: "{{ demo_platform.itsm_app.password }}"
        itsm_validate_certs: false
      when: demo_platform is defined
      no_log: true

- name: Fail when ITSM connection facts could not be resolved
  ansible.builtin.fail:
    msg: >-
      ITSM connection facts are missing. Attach the ITSM App credential in AAP, pass
      -e itsm_api_base_url/itsm_api_user/itsm_api_password, or run from the repo root with
      artifacts/demo_platform_facts.yml present for local fallback.
  when: itsm_api_base_url is not defined
