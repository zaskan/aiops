---
- name: Set Gitea host for authenticated git clone
  ansible.builtin.set_fact:
    vm_manifest_gitea_host: >-
      {{ vm_manifest_gitea_api_base | regex_replace('^https?://', '') | regex_replace('/$', '') }}

- name: Build authenticated Gitea clone URL for Infrastructure repository
  ansible.builtin.set_fact:
    vm_manifest_gitea_clone_repo: >-
      {{
        (
          'http://'
          ~ vm_manifest_gitea_username | urlencode ~ ':'
          ~ vm_manifest_gitea_password | urlencode ~ '@'
          ~ vm_manifest_gitea_internal_host ~ '/'
          ~ vm_manifest_gitea_owner | urlencode ~ '/'
          ~ vm_manifest_gitea_repo | urlencode ~ '.git'
        )
        if (vm_manifest_gitea_use_internal | default(false) | bool)
        else (
          'https://'
          ~ vm_manifest_gitea_username | urlencode ~ ':'
          ~ vm_manifest_gitea_password | urlencode ~ '@'
          ~ vm_manifest_gitea_host ~ '/'
          ~ vm_manifest_gitea_owner | urlencode ~ '/'
          ~ vm_manifest_gitea_repo | urlencode ~ '.git'
        )
      }}
  no_log: true

- name: Remove temporary Infrastructure clone directory
  ansible.builtin.file:
    path: "{{ vm_manifest_workdir }}/repo"
    state: absent

- name: Clone Gitea Infrastructure repository
  block:
    - name: Clone Gitea Infrastructure repository from Gitea
      ansible.builtin.git:
        repo: "{{ vm_manifest_gitea_clone_repo }}"
        dest: "{{ vm_manifest_workdir }}/repo"
        version: "{{ vm_manifest_gitea_branch }}"
        single_branch: true
        force: true
      environment:
        GIT_SSL_NO_VERIFY: >-
          {{
            'false'
            if (
              vm_manifest_gitea_use_internal | default(false) | bool
              or vm_manifest_validate_certs | bool
            )
            else 'true'
          }}
      no_log: true
  rescue:
    - name: Report Gitea Infrastructure repository clone failure
      ansible.builtin.fail:
        msg: >-
          Failed to clone Gitea repository {{ vm_manifest_gitea_owner }}/{{ vm_manifest_gitea_repo }}
          (branch {{ vm_manifest_gitea_branch }}). Verify the Gitea credential URL is
          https://gitea-gitea.apps.<cluster-domain> (not *.apps.apps.*), the Infrastructure
          repository exists, and the job can reach Gitea
          {% if vm_manifest_gitea_use_internal | default(false) | bool -%}
          at http://{{ vm_manifest_gitea_internal_host }}.
          {% else -%}
          at https://{{ vm_manifest_gitea_host }}.
          {% endif -%}
          Re-run playbooks/install.yml or playbooks/casc/configure_aap_credentials.yml
          to refresh the Gitea credential after correcting the route.

- name: Ensure vms directory exists in Infrastructure repository
  ansible.builtin.file:
    path: "{{ vm_manifest_workdir }}/repo/{{ vm_manifest_gitea_path }}"
    state: directory
    mode: "0755"

- name: Copy rendered VM manifest into Infrastructure repository
  ansible.builtin.copy:
    src: "{{ vm_manifest_workdir }}/{{ vm_manifest_gitea_path }}/{{ vm_name }}.yaml"
    dest: "{{ vm_manifest_workdir }}/repo/{{ vm_manifest_gitea_path }}/{{ vm_name }}.yaml"
    mode: "0644"

- name: Commit and push VM manifest to Gitea Infrastructure repository
  ansible.builtin.shell: |
    set -euo pipefail
    git config user.email "{{ vm_manifest_git_user_email }}"
    git config user.name "{{ vm_manifest_git_user_name }}"
    git add "{{ vm_manifest_gitea_path }}/{{ vm_name }}.yaml"
    git commit -m "Add or update VM manifest {{ vm_name }}"
    git -c http.sslVerify={{ 'true' if vm_manifest_validate_certs | bool else 'false' }} push origin "{{ vm_manifest_gitea_branch }}"
  args:
    chdir: "{{ vm_manifest_workdir }}/repo"
  register: vm_manifest_git_push
  changed_when: vm_manifest_git_push.rc == 0
  failed_when: >
    (vm_manifest_git_push.rc not in [0, 1])
    or (
      vm_manifest_git_push.rc != 0
      and ('nothing to commit' not in (vm_manifest_git_push.stdout | default('') | lower))
      and ('nothing to commit' not in (vm_manifest_git_push.stderr | default('') | lower))
      and ('up to date' not in (vm_manifest_git_push.stdout | default('') | lower))
      and ('up to date' not in (vm_manifest_git_push.stderr | default('') | lower))
    )
  no_log: true

- name: Capture Infrastructure repository git commit after push
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ vm_manifest_workdir }}/repo"
  register: vm_manifest_git_head
  changed_when: false

- name: Record Infrastructure git commit for ITSM CTASK comment
  ansible.builtin.set_fact:
    itsm_vm_git_commit: "{{ vm_manifest_git_head.stdout | trim }}"

- name: Remove temporary Infrastructure clone directory after push
  ansible.builtin.file:
    path: "{{ vm_manifest_workdir }}/repo"
    state: absent
