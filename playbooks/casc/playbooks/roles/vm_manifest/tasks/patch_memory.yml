---
- name: Start ITSM change task tracking
  ansible.builtin.import_role:
    name: itsm_change_task
    tasks_from: start.yml

- name: Load Gitea connection facts from AAP credential or local artifact
  ansible.builtin.include_tasks: ../common/tasks/load_gitea_credential.yml

- name: Validate memory patch required variables
  ansible.builtin.assert:
    that:
      - vm_name | default('') | trim | length > 0
      - mem | default('') | string | trim | length > 0
    fail_msg: vm_name and mem are required for memory manifest patch.

- name: Lookup current CPUs from ITSM VM asset when cpus is not provided
  ansible.builtin.include_tasks: ../common/tasks/lookup_itsm_vm_asset_resources.yml
  when: cpus is not defined or cpus | string | trim | length == 0

- name: Adopt resolved CPUs for memory manifest patch
  ansible.builtin.set_fact:
    cpus: "{{ vm_asset_resolved_cpus }}"
  when: vm_asset_resolved_cpus is defined

- name: Patch VM manifest memory in Gitea Infrastructure
  ansible.builtin.include_tasks: patch_resources.yml
  vars:
    vm_manifest_patch_update_cpus: false
    vm_manifest_patch_update_mem: true

- name: Display VM memory patch summary
  ansible.builtin.debug:
    msg:
      - "VM name: {{ vm_name }}"
      - "CPUs (unchanged): {{ cpus }}"
      - "Memory: {{ mem }} GiB"
      - "Manifest path: {{ vm_manifest_gitea_repo }}/{{ vm_manifest_gitea_path }}/{{ vm_name }}.yaml"

- name: Complete ITSM change task tracking
  ansible.builtin.import_role:
    name: itsm_change_task
    tasks_from: complete.yml
