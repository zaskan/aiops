---
- name: Resolve application systemd service unit
  ansible.builtin.set_fact:
    generic_app_service_resolved: "{{ app_service | default(generic_app_default_service) | trim }}"

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ generic_app_service_resolved }}"
    enabled: true
    state: started

- name: Wait for application HTTP endpoint on localhost
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: [200, 403, 301, 302]
  register: generic_app_http_check
  until: generic_app_http_check.status in [200, 403, 301, 302]
  retries: 12
  delay: 5
  when: generic_app_service_resolved == 'httpd'
