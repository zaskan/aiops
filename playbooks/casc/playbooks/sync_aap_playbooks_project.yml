---
- name: Sync AIOps Playbooks project from Gitea
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Refresh AIOps Playbooks SCM project in AAP
      ansible.builtin.include_role:
        name: lightspeed_remediation
        tasks_from: sync_project.yml
