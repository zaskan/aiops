---
- name: Remove legacy Apache Application Stack objects from ITSM and AAP
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../group_vars/all/legacy_apache_stack.yml
    - ../../group_vars/all/aap_apache_stack_pipeline.yml
    - ../../artifacts/demo_platform_facts.yml
  vars:
    demo_platform_artifacts_dir: "{{ playbook_dir }}/../../artifacts"
    demo_platform_artifacts_file: "{{ playbook_dir }}/../../artifacts/demo_platform_facts.yml"
  tasks:
    - name: Check demo platform facts artifact exists
      ansible.builtin.stat:
        path: "{{ demo_platform_artifacts_file }}"
      register: legacy_apache_stack_artifacts_stat

    - name: Fail when demo platform facts artifact is missing
      ansible.builtin.fail:
        msg: >-
          artifacts/demo_platform_facts.yml not found. Run playbooks/install.yml first.
      when: not legacy_apache_stack_artifacts_stat.stat.exists

    - name: Remove legacy Apache stack objects
      ansible.builtin.include_tasks:
        file: ../../roles/demo_platform/tasks/remove_legacy_apache_stack_objects.yml
