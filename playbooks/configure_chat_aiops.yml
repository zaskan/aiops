---
- name: Configure chat-app for AIOps demo
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/chat_aiops.yml
  vars:
    demo_platform_artifacts_file: "{{ playbook_dir }}/../artifacts/demo_platform_facts.yml"
  tasks:
    - name: Check demo platform facts artifact exists
      ansible.builtin.stat:
        path: "{{ demo_platform_artifacts_file }}"
      register: demo_platform_artifacts_stat

    - name: Fail when demo platform facts artifact is missing
      ansible.builtin.fail:
        msg: >-
          artifacts/demo_platform_facts.yml not found. Run
          playbooks/check_and_prepare_demo.yml first to generate platform facts.
      when: not demo_platform_artifacts_stat.stat.exists

    - name: Load demo platform facts artifact
      ansible.builtin.include_vars:
        file: "{{ demo_platform_artifacts_file }}"

    - name: Map chat-app API connection from artifact
      ansible.builtin.set_fact:
        chat_api_base: "{{ demo_platform.chat_app.url }}"
        chat_admin_username: "{{ demo_platform.chat_app.username }}"
        chat_admin_password: "{{ demo_platform.chat_app.password }}"
        chat_validate_certs: false
      no_log: true

    - name: Provision aiops user, operations channel, and anonymous webhook
      ansible.builtin.include_role:
        name: chat_app

    - name: Verify anonymous webhook accepts unauthenticated posts
      ansible.builtin.uri:
        url: >-
          {{ demo_platform.chat_app.url }}/api/v1/webhooks/channels/{{
          chat_aiops_channel_name | urlencode }}/messages
        method: POST
        body_format: json
        body:
          body: AIOps bootstrap verification
        validate_certs: false
        status_code: 201
        timeout: 30
      register: chat_aiops_webhook_verify

    - name: Fail when anonymous webhook verification fails
      ansible.builtin.fail:
        msg: >-
          Anonymous webhook verification failed for channel '{{ chat_aiops_channel_name }}'.
          Confirm allow_anonymous_webhook is enabled and user '{{ chat_aiops_username }}'
          is a channel member. Webhook URL:
          {{ demo_platform.chat_app.url }}/api/v1/webhooks/channels/{{ chat_aiops_channel_name }}/messages
      when: chat_aiops_webhook_verify.status | default(0) != 201

    - name: Display chat AIOps configuration summary
      ansible.builtin.debug:
        msg:
          - "User: {{ chat_aiops_username }}"
          - "Channel: {{ chat_aiops_channel_name }}"
          - "Anonymous webhook URL: {{ demo_platform.chat_app.url }}/api/v1/webhooks/channels/{{ chat_aiops_channel_name }}/messages"
          - 'Example: curl -X POST -H "Content-Type: application/json" -d ''{"body":"hello"}'' {{ demo_platform.chat_app.url }}/api/v1/webhooks/channels/{{ chat_aiops_channel_name }}/messages'
