---
- name: Ensure AIOps Infrastructure inventory exists in AAP
  awx.awx.inventory:
    name: "{{ aap_vm_pipeline_infrastructure_inventory }}"
    organization: "{{ aap_vm_pipeline_organization }}"
    state: present
    controller_host: "{{ aap_vm_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_vm_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_vm_pipeline_validate_certs }}"
  register: aap_controller_api_result
  until: aap_controller_api_result is succeeded
  retries: "{{ aap_controller_api_retries }}"
  delay: "{{ aap_controller_api_retry_delay }}"
- name: Ensure ITSM Assets inventory source exists in AAP
  awx.awx.inventory_source:
    name: "{{ aap_vm_pipeline_inventory_source }}"
    description: ITSM assets marked for external inventory
    inventory: "{{ aap_vm_pipeline_infrastructure_inventory }}"
    organization: "{{ aap_vm_pipeline_organization }}"
    source: scm
    source_project: "{{ aap_vm_pipeline_project }}"
    source_path: "{{ aap_vm_pipeline_inventory_script }}"
    credential: "{{ aap_vm_pipeline_credential_itsm }}"
    overwrite: true
    update_on_launch: "{{ aap_pipeline_inventory_update_on_launch | bool }}"
    state: present
    controller_host: "{{ aap_vm_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_vm_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_vm_pipeline_validate_certs }}"
  register: aap_controller_api_result
  until: aap_controller_api_result is succeeded
  retries: "{{ aap_controller_api_retries }}"
  delay: "{{ aap_controller_api_retry_delay }}"
