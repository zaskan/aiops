---
- name: Run AAP VM pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Configure AAP inventory, project, job templates, and workflow
  block:
    - name: Ensure AIOps localhost inventory exists
      ansible.builtin.include_tasks: inventory.yml

    - name: Ensure Gitea Source Control credential exists in AAP
      ansible.builtin.include_tasks: scm_credential.yml

    - name: Ensure AIOps Playbooks project exists
      ansible.builtin.include_tasks: project.yml

    - name: Ensure VM pipeline job templates exist
      ansible.builtin.include_tasks: job_templates.yml

    - name: Ensure Provision VM workflow exists
      ansible.builtin.include_tasks: workflow.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_vm_pipeline_controller_api_prefix }}"

- name: Display AAP VM pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_vm_pipeline_organization }}"
      - "Project: {{ aap_vm_pipeline_project }}"
      - "Job templates: {{ aap_vm_pipeline_jt_push_vm }}, {{ aap_vm_pipeline_jt_sync_vms }}"
      - "Workflow: {{ aap_vm_pipeline_workflow }}"
