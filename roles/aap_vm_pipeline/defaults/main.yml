---
aap_vm_pipeline_organization: AIOps
aap_vm_pipeline_validate_certs: false
aap_vm_pipeline_controller_api_prefix: /api/controller/

aap_vm_pipeline_inventory: AIOps Localhost
aap_vm_pipeline_project: AIOps Playbooks
aap_vm_pipeline_gitea_repo: Playbooks
aap_vm_pipeline_scm_branch: main
aap_vm_pipeline_gitea_scm_use_internal: true
aap_vm_pipeline_gitea_scm_internal_host: gitea-http.gitea.svc.cluster.local:3000

aap_vm_pipeline_jt_push_vm: Push VM Manifest
aap_vm_pipeline_jt_sync_vms: Sync Infrastructure VMs
aap_vm_pipeline_workflow: Provision VM

aap_vm_pipeline_playbook_push: push_vm_manifest.yml
aap_vm_pipeline_playbook_sync: sync_infrastructure_vms.yml

aap_vm_pipeline_workflow_survey_spec:
  name: Provision VM
  description: Parameters for the virtual machine to provision
  spec:
    - question_name: vm_name
      question_description: Virtual machine name
      required: true
      type: text
      variable: vm_name
    - question_name: cpus
      question_description: Number of CPU cores
      required: true
      type: integer
      variable: cpus
      min: 1
      max: 64
    - question_name: mem
      question_description: Memory in GiB
      required: true
      type: integer
      variable: mem
      min: 1
      max: 512

aap_vm_pipeline_credential_gitea: Gitea
aap_vm_pipeline_credential_gitea_scm: Gitea SCM
aap_vm_pipeline_credential_openshift: OpenShift Cluster

aap_vm_pipeline_artifacts_file: "{{ playbook_dir }}/../../artifacts/demo_platform_facts.yml"
