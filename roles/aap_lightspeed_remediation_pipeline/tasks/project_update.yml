---
- name: Sync AIOps Playbooks project before creating Lightspeed remediation job templates
  awx.awx.project_update:
    project: "{{ aap_lightspeed_remediation_pipeline_project }}"
    organization: "{{ aap_lightspeed_remediation_pipeline_organization }}"
    wait: true
    controller_host: "{{ aap_lightspeed_remediation_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_lightspeed_remediation_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_lightspeed_remediation_pipeline_validate_certs }}"
  register: aap_lightspeed_remediation_pipeline_project_update
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_lightspeed_remediation_pipeline_controller_api_prefix }}"

- name: Fail when AIOps Playbooks SCM sync did not succeed
  ansible.builtin.fail:
    msg: >-
      AIOps Playbooks project SCM sync failed before Lightspeed remediation job template
      creation ({{ aap_lightspeed_remediation_pipeline_project_update.msg | default('unknown error') }}).
  when: aap_lightspeed_remediation_pipeline_project_update.failed | default(false)
