---
- name: Ensure Deploy Generic App workflow job template exists in AAP
  awx.awx.workflow_job_template:
    name: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    inventory: "{{ aap_httpd_pipeline_inventory }}"
    survey_enabled: true
    survey_spec: "{{ aap_httpd_pipeline_workflow_survey_spec }}"
    extra_vars: "{{ aap_itsm_subworkflow_extra_vars | combine(aap_httpd_survey_job_extra_vars) }}"
    ask_variables_on_launch: true
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Start application services workflow node exists
  awx.awx.workflow_job_template_node:
    identifier: start_httpd
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_start }}"
    extra_data:
      itsm_change_ref: "{{ '{{ itsm_change_ref }}' }}"
      itsm_service_request_ref: "{{ '{{ itsm_service_request_ref | default(\"\") }}' }}"
      itsm_ctask_template_name: "{{ itsm_apache_stack_task_template_start_httpd }}"
      target_host: "{{ '{{ vm_name | default(target_host) }}' }}"
      vm_name: "{{ '{{ vm_name | default(target_host) }}' }}"
      app_repo: "{{ '{{ app_repo }}' }}"
      app_branch: "{{ '{{ app_branch | default(\"main\") }}' }}"
      apache_app_rpm_packages: "{{ '{{ apache_app_rpm_packages | default(\"httpd,git\") }}' }}"
      apache_app_docroot: "{{ '{{ apache_app_docroot | default(\"/var/www/html\") }}' }}"
      apache_app_enabled_services: "{{ '{{ apache_app_enabled_services | default(\"httpd\") }}' }}"
      apache_exposure_service_port: "{{ '{{ apache_exposure_service_port | default(\"80\") }}' }}"
    success_nodes: []
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Register ITSM Generic Application Asset workflow node exists
  awx.awx.workflow_job_template_node:
    identifier: register_itsm_apache_app_asset
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_register_itsm }}"
    extra_data:
      target_host: "{{ '{{ vm_name | default(target_host) }}' }}"
      vm_name: "{{ '{{ vm_name | default(target_host) }}' }}"
      app_repo: "{{ '{{ app_repo }}' }}"
      app_branch: "{{ '{{ app_branch | default(\"main\") }}' }}"
      apache_app_rpm_packages: "{{ '{{ apache_app_rpm_packages | default(\"httpd,git\") }}' }}"
      apache_app_docroot: "{{ '{{ apache_app_docroot | default(\"/var/www/html\") }}' }}"
      apache_app_enabled_services: "{{ '{{ apache_app_enabled_services | default(\"httpd\") }}' }}"
      apache_exposure_service_port: "{{ '{{ apache_exposure_service_port | default(\"80\") }}' }}"
    success_nodes:
      - start_httpd
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Expose application workflow node exists
  awx.awx.workflow_job_template_node:
