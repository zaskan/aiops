---
- name: Ensure Deploy Apache App workflow job template exists in AAP
  awx.awx.workflow_job_template:
    name: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    inventory: "{{ aap_httpd_pipeline_inventory }}"
    survey_enabled: true
    survey_spec: "{{ aap_httpd_pipeline_workflow_survey_spec }}"
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Start httpd workflow node exists
  awx.awx.workflow_job_template_node:
    identifier: start_httpd
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_start }}"
    success_nodes: []
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Clear Deploy Apache App workflow node edges before re-linking
  awx.awx.workflow_job_template_node:
    identifier: deploy_apache_app
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_deploy }}"
    success_nodes: []
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Clear Install httpd workflow node edges before re-linking
  awx.awx.workflow_job_template_node:
    identifier: install_httpd
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_install }}"
    success_nodes: []
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Deploy Apache App workflow node exists
  awx.awx.workflow_job_template_node:
    identifier: deploy_apache_app
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_deploy }}"
    success_nodes:
      - start_httpd
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"

- name: Ensure Install httpd workflow node exists
  awx.awx.workflow_job_template_node:
    identifier: install_httpd
    workflow_job_template: "{{ aap_httpd_pipeline_workflow }}"
    organization: "{{ aap_httpd_pipeline_organization }}"
    unified_job_template: "{{ aap_httpd_pipeline_jt_install }}"
    success_nodes:
      - deploy_apache_app
    state: present
    controller_host: "{{ aap_httpd_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_httpd_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_httpd_pipeline_validate_certs }}"
