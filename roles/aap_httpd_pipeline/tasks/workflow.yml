      app_repo: "{{ '{{ app_repo }}' }}"
      app_branch: "{{ '{{ app_branch | default(\"main\") }}' }}"
      apache_app_rpm_packages: "{{ '{{ apache_app_rpm_packages | default(\"httpd,git\") }}' }}"
      apache_app_docroot: "{{ '{{ apache_app_docroot | default(\"/var/www/html\") }}' }}"
      apache_app_enabled_services: "{{ '{{ apache_app_enabled_services | default(\"httpd\") }}' }}"
      apache_exposure_service_port: "{{ '{{ apache_exposure_service_port | default(\"80\") }}' }}"
    success_nodes:
