---
- name: Run AAP VM modification pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Configure AAP VM modification job templates and workflows
  block:
    - name: Ensure VM modification job templates exist
      ansible.builtin.include_tasks: job_templates.yml

    - name: Ensure Modify VM CPUs workflow exists
      ansible.builtin.include_tasks: workflow_cpu.yml

    - name: Ensure Modify VM Memory workflow exists
      ansible.builtin.include_tasks: workflow_memory.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_vm_modification_pipeline_controller_api_prefix }}"

- name: Display AAP VM modification pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_vm_modification_pipeline_organization }}"
      - "Project: {{ aap_vm_modification_pipeline_project }}"
      - "Job templates: {{ aap_vm_cpu_modification_pipeline_jt_patch }}, {{ aap_vm_memory_modification_pipeline_jt_patch }}, {{ aap_vm_modification_pipeline_jt_restart_vm }}"
      - "Workflows: {{ aap_vm_cpu_modification_pipeline_workflow }}, {{ aap_vm_memory_modification_pipeline_workflow }}"
