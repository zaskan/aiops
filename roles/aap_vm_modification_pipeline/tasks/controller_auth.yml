---
- name: Obtain AAP gateway OAuth token for awx.awx modules
  ansible.builtin.uri:
    url: "{{ aap_vm_modification_pipeline_controller_host }}/api/gateway/v1/tokens/"
    method: POST
    user: "{{ aap_vm_modification_pipeline_controller_username }}"
    password: "{{ aap_vm_modification_pipeline_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_vm_modification_pipeline_validate_certs }}"
    body_format: json
    body:
      description: aap-vm-modification-pipeline ansible automation
      scope: write
    status_code: 201
  register: aap_vm_modification_pipeline_gateway_token_create
  no_log: true

- name: Set AAP controller OAuth token fact
  ansible.builtin.set_fact:
    aap_vm_modification_pipeline_controller_oauthtoken: "{{ aap_vm_modification_pipeline_gateway_token_create.json.token }}"
  no_log: true
