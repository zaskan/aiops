---
- name: Remove Apache httpd pipeline job templates from AAP
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop:
    - "{{ aap_httpd_pipeline_jt_install }}"
    - "{{ aap_httpd_pipeline_jt_deploy }}"
    - "{{ aap_httpd_pipeline_jt_expose }}"
    - "{{ aap_httpd_pipeline_jt_register_itsm }}"
    - "{{ aap_httpd_pipeline_jt_start }}"

- name: Remove Apache troubleshoot pipeline job templates from AAP
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop:
    - "{{ aap_apache_troubleshoot_pipeline_jt_create_incident }}"
    - "{{ aap_apache_troubleshoot_pipeline_jt_troubleshoot }}"

- name: Remove ITSM chat notification job template from AAP
  awx.awx.job_template:
    name: "{{ aap_itsm_chat_pipeline_jt_publish }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  ignore_errors: true

- name: Remove Lightspeed remediation pipeline job templates from AAP
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop:
    - "{{ aap_lightspeed_remediation_pipeline_jt_upload }}"
    - "{{ aap_lightspeed_remediation_pipeline_jt_sync }}"
    - "{{ aap_lightspeed_remediation_pipeline_jt_create }}"
    - "{{ aap_lightspeed_remediation_pipeline_jt_launch }}"
    - "{{ aap_lightspeed_remediation_pipeline_jt_close }}"

- name: Remove VM pipeline job templates from AAP
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop:
    - "{{ aap_vm_pipeline_jt_push_vm }}"
    - "{{ aap_vm_pipeline_jt_sync_vms }}"
    - "{{ aap_vm_pipeline_jt_register_itsm }}"

- name: Remove VM modification pipeline job templates from AAP
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop:
    - "{{ aap_vm_cpu_modification_pipeline_jt_patch }}"
    - "{{ aap_vm_memory_modification_pipeline_jt_patch }}"
    - "{{ aap_vm_modification_pipeline_jt_restart_vm }}"

- name: Remove legacy Deploy Apache App job template from AAP if present
  awx.awx.job_template:
    name: "{{ item }}"
    organization: "{{ aap_uninstall_organization }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop: "{{ [aap_uninstall_legacy_jt_deploy_apache_app] + (aap_uninstall_legacy_apache_stack_job_templates | default([])) | unique }}"
