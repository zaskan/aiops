---
- name: Remove AIOps organization credentials from AAP
  awx.awx.credential:
    name: "{{ item.name }}"
    organization: "{{ aap_uninstall_organization }}"
    credential_type: "{{ item.credential_type }}"
    state: absent
    controller_host: "{{ aap_uninstall_controller_host }}"
    controller_oauthtoken: "{{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
  loop: "{{ aap_uninstall_credentials }}"
  loop_control:
    label: "{{ item.name }}"
