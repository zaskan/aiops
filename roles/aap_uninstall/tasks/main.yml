---
- name: Run AAP uninstall preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Check whether AIOps organization exists in controller
  ansible.builtin.uri:
    url: >-
      {{ aap_uninstall_controller_host }}/api/controller/v2/organizations/?name={{
      aap_uninstall_organization | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_uninstall_controller_oauthtoken }}"
    validate_certs: "{{ aap_uninstall_validate_certs }}"
    status_code: 200
  register: aap_uninstall_org_check

- name: Set AIOps organization presence fact
  ansible.builtin.set_fact:
    aap_uninstall_org_present: "{{ aap_uninstall_org_check.json.count | default(0) > 0 }}"

- name: Remove AIOps organization resources from AAP
  when: aap_uninstall_org_present | bool
  block:
    - name: Remove workflow job templates
      ansible.builtin.include_tasks: workflows.yml

    - name: Remove job templates
      ansible.builtin.include_tasks: job_templates.yml

    - name: Remove AIOps Playbooks project
      ansible.builtin.include_tasks: project.yml

    - name: Remove inventories
      ansible.builtin.include_tasks: inventories.yml

    - name: Remove credentials
      ansible.builtin.include_tasks: credentials.yml

    - name: Remove AIOps organization
      ansible.builtin.include_tasks: organization.yml

    - name: Remove custom credential types
      ansible.builtin.include_tasks: credential_types.yml
      when: uninstall_aap_remove_credential_types | bool
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_uninstall_controller_api_prefix }}"

- name: Remove custom credential types when AIOps organization is already absent
  when:
    - not aap_uninstall_org_present | bool
    - uninstall_aap_remove_credential_types | bool
  block:
    - name: Remove custom credential types from AAP
      ansible.builtin.include_tasks: credential_types.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_uninstall_controller_api_prefix }}"

- name: Display AAP uninstall summary
  ansible.builtin.debug:
    msg:
      - >-
        AIOps organization:
        {{ 'removed' if aap_uninstall_org_present | bool else 'not found (already absent)' }}
      - "Removed workflows: {{ aap_httpd_pipeline_workflow }}, {{ aap_vm_pipeline_workflow }}"
      - "Removed project: {{ aap_vm_pipeline_project }}"
      - "Removed inventories: {{ aap_httpd_pipeline_inventory }}, {{ aap_vm_pipeline_inventory }}"
      - >-
        Removed credentials: {{ aap_casc_credential_openshift }}, {{ aap_casc_credential_aap }},
        {{ aap_casc_credential_ah_published }}, {{ aap_casc_credential_ah_validated }},
        {{ aap_casc_credential_chat }}, {{ aap_casc_credential_gitea }},
        {{ aap_casc_credential_gitops }}, {{ aap_casc_credential_itsm }},
        {{ aap_casc_credential_vms }}, {{ aap_vm_pipeline_credential_gitea_scm }}
      - >-
        Custom credential types removed:
        {{ uninstall_aap_remove_credential_types | bool | ternary(
          aap_uninstall_credential_type_chat ~ ', ' ~ aap_uninstall_credential_type_gitea ~ ', '
          ~ aap_uninstall_credential_type_gitops ~ ', ' ~ aap_uninstall_credential_type_itsm,
          'skipped'
        ) }}
