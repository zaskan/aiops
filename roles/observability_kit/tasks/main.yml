---
- name: Run observability kit preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Remove legacy Strimzi operator deployment when present
  ansible.builtin.include_tasks: cleanup_legacy_strimzi.yml

- name: Render observability stack manifests for GitOps
  ansible.builtin.include_tasks: render_manifests.yml

- name: Push observability manifests to Gitea Observability repository
  ansible.builtin.include_tasks: push_manifests.yml

- name: Sync Observability stack to OpenShift via Argo CD
  ansible.builtin.include_tasks: sync_gitops.yml

- name: Wait for Kafka cluster to become Ready before dependent services start
  ansible.builtin.include_tasks: wait_kafka.yml

- name: Wait for observability stack readiness
  ansible.builtin.include_tasks: wait_ready.yml

- name: Discover Grafana external Route URL
  ansible.builtin.include_tasks: discover_grafana_route.yml

- name: Publish observability facts to demo platform artifact
  ansible.builtin.include_tasks: update_artifact.yml

- name: Configure AAP controller native log aggregation
  ansible.builtin.include_tasks: configure_aap_logging_aggregation.yml
  when: observability_kit_configure_aap_logging | default(true) | bool

- name: Verify observability stack health endpoints
  ansible.builtin.include_tasks: verify_e2e.yml

- name: Display observability kit summary
  ansible.builtin.debug:
    msg:
      - "GitOps repo: {{ observability_kit_gitea_repo }} @ {{ observability_kit_git_commit | default('unknown') }}"
      - "Argo CD Application: {{ gitops_observability_app_name | default('observability-stack') }}"
      - "Namespace: {{ observability_kit_namespace }}"
      - "Kafka bootstrap: {{ observability_kit_kafka_internal_bootstrap }}"
      - "Topics: {{ observability_kit_kafka_topic_alertmanager }}, {{ observability_kit_kafka_topic_itsm }}, {{ observability_kit_kafka_topic_aap_logs }}"
      - "Upstream collector (Alertmanager): http://{{ observability_kit_collector_internal_host }}:{{ observability_kit_collector_alertmanager_port }}{{ observability_kit_collector_alertmanager_path }}"
      - "Upstream collector (ITSM): http://{{ observability_kit_collector_internal_host }}:{{ observability_kit_collector_itsm_port }}{{ observability_kit_collector_itsm_path }}"
      - "Upstream collector (AAP logs): http://{{ observability_kit_collector_internal_host }}:{{ observability_kit_collector_aap_logs_port }}{{ observability_kit_collector_aap_logs_path }}"
      - "AAP logging aggregation: {{ 'enabled' if observability_kit_configure_aap_logging | default(true) | bool else 'disabled' }}"
      - "Loki OTLP: {{ observability_kit_loki_internal_url }}{{ observability_kit_loki_otlp_path }}"
      - "Grafana: {{ observability_kit_grafana_url | default('pending route') }}"
