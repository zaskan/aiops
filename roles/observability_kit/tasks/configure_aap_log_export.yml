---
- name: Load demo platform facts artifact for AAP log export
  ansible.builtin.include_vars:
    file: "{{ observability_kit_artifact_file }}"

- name: Resolve upstream collector OTLP endpoint for AAP log export
  ansible.builtin.set_fact:
    observability_kit_aap_log_otlp_endpoint: >-
      {{
        demo_platform.observability.collector_otlp_grpc
        | default(observability_kit_collector_internal_host ~ ':' ~ observability_kit_collector_otlp_grpc_port)
      }}

- name: Deploy OTel log forwarder DaemonSet in AAP namespace
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'aap_log_forwarder.yaml.j2') | from_yaml_all | list }}"

- name: Grant privileged SCC to AAP log forwarder service account
  ansible.builtin.command:
    argv:
      - oc
      - adm
      - policy
      - add-scc-to-user
      - privileged
      - -z
      - "{{ observability_kit_aap_log_collector_name }}"
      - -n
      - "{{ observability_kit_aap_namespace }}"
  register: observability_kit_aap_scc
  changed_when: "'added' in observability_kit_aap_scc.stdout"
  failed_when: observability_kit_aap_scc.rc != 0 and 'already' not in observability_kit_aap_scc.stderr

- name: Send probe OTLP log to upstream collector from inside cluster
  ansible.builtin.command:
    argv:
      - oc
      - run
      - aap-otlp-log-probe
      - --rm
      - -i
      - --restart=Never
      - -n
      - "{{ observability_kit_namespace }}"
      - --image=curlimages/curl:8.5.0
      - --
      - curl
      - -sf
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"aiops-aap-probe"}}]},"scopeLogs":[{"logRecords":[{"body":{"stringValue":"AIOps observability kit OTLP probe log"},"severityText":"INFO"}]}]}]}'
      - "http://{{ observability_kit_collector_upstream_name }}:{{ observability_kit_collector_otlp_http_port }}/v1/logs"
  register: observability_kit_aap_otlp_probe
  changed_when: false
  failed_when: false
