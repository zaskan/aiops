---
- name: Read demo platform facts artifact from disk before merging observability block
  ansible.builtin.slurp:
    src: "{{ observability_kit_artifact_file }}"
  register: observability_kit_artifact_slurp
  no_log: true

- name: Merge observability block into demo platform facts
  ansible.builtin.set_fact:
    demo_platform_artifact_merged: >-
      {{
        (observability_kit_artifact_slurp.content | b64decode | from_yaml).demo_platform | default({})
        | combine({
            'observability': {
              'namespace': observability_kit_namespace,
              'kafka_bootstrap': observability_kit_kafka_internal_bootstrap,
              'kafka_topics': {
                'alertmanager': observability_kit_kafka_topic_alertmanager,
                'itsm': observability_kit_kafka_topic_itsm,
                'aap_logs': observability_kit_kafka_topic_aap_logs,
              },
              'collector_internal_host': observability_kit_collector_internal_host,
              'collector_alertmanager_url': (
                'http://'
                ~ observability_kit_collector_internal_host
                ~ ':'
                ~ observability_kit_collector_alertmanager_port
                ~ observability_kit_collector_alertmanager_path
              ),
              'collector_itsm_url': (
                'http://'
                ~ observability_kit_collector_internal_host
                ~ ':'
                ~ observability_kit_collector_itsm_port
                ~ observability_kit_collector_itsm_path
              ),
              'collector_aap_logs_url': (
                'http://'
                ~ observability_kit_collector_internal_host
                ~ ':'
                ~ observability_kit_collector_aap_logs_port
                ~ observability_kit_collector_aap_logs_path
              ),
              'aap_logging_aggregation_enabled': observability_kit_configure_aap_logging | default(true) | bool,
              'collector_otlp_grpc': (
                observability_kit_collector_internal_host
                ~ ':'
                ~ observability_kit_collector_otlp_grpc_port
              ),
              'collector_otlp_http': (
                'http://'
                ~ observability_kit_collector_internal_host
                ~ ':'
                ~ observability_kit_collector_otlp_http_port
              ),
              'alertmanager_webhook_username': observability_kit_alertmanager_webhook_username,
              'alertmanager_webhook_password': observability_kit_alertmanager_webhook_password,
              'itsm_webhook_username': observability_kit_itsm_webhook_username,
              'itsm_webhook_password': observability_kit_itsm_webhook_password,
              'loki_otlp_url': (
                observability_kit_loki_internal_url
                ~ observability_kit_loki_otlp_path
              ),
              'loki_query_url': observability_kit_loki_internal_url,
              'grafana_url': observability_kit_grafana_url | default(''),
              'grafana_username': observability_kit_grafana_admin_user,
              'grafana_password': observability_kit_grafana_admin_password,
              'grafana_dashboard_folder': observability_kit_grafana_dashboard_folder,
              'gitops_repo': observability_kit_gitea_repo,
              'gitops_app': gitops_observability_app_name | default('observability-stack'),
            }
          }, recursive=True)
      }}
  no_log: true

- name: Write observability facts into demo platform artifact
  ansible.builtin.copy:
    dest: "{{ observability_kit_artifact_file }}"
    mode: "0600"
    content: |
      ---
      demo_platform:
      {{ demo_platform_artifact_merged | to_nice_yaml(indent=2) | indent(2, first=True) }}
  no_log: true

- name: Refresh in-memory demo platform facts after observability artifact update
  ansible.builtin.set_fact:
    demo_platform: "{{ demo_platform_artifact_merged }}"
  no_log: true
