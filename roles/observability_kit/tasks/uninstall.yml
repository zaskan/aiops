---
- name: Remove AAP log forwarder DaemonSet
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: DaemonSet
    name: "{{ observability_kit_aap_log_collector_name }}"
    namespace: "{{ observability_kit_aap_namespace }}"
  ignore_errors: true

- name: Remove AAP log forwarder ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ observability_kit_aap_log_collector_name }}-config"
    namespace: "{{ observability_kit_aap_namespace }}"
  ignore_errors: true

- name: Remove AAP log forwarder ServiceAccount
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ServiceAccount
    name: "{{ observability_kit_aap_log_collector_name }}"
    namespace: "{{ observability_kit_aap_namespace }}"
  ignore_errors: true

- name: Remove downstream OTel Collector resources
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ observability_kit_collector_downstream_name }}"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove downstream OTel Collector ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ observability_kit_collector_downstream_name }}-config"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove upstream OTel Collector resources
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ observability_kit_collector_upstream_name }}"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove upstream OTel Collector ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ observability_kit_collector_upstream_name }}-config"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove upstream OTel Collector Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ observability_kit_collector_upstream_name }}"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove Grafana Route, Service, Deployment, and ConfigMaps
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ observability_kit_namespace }}"
  loop:
    - { apiVersion: route.openshift.io/v1, kind: Route, name: "{{ observability_kit_grafana_route_name }}" }
    - { apiVersion: v1, kind: Service, name: "{{ observability_kit_grafana_name }}" }
    - { apiVersion: apps/v1, kind: Deployment, name: "{{ observability_kit_grafana_name }}" }
    - { apiVersion: v1, kind: ConfigMap, name: "{{ observability_kit_grafana_name }}-datasources" }
    - { apiVersion: v1, kind: ConfigMap, name: "{{ observability_kit_grafana_name }}-dashboards-provider" }
    - { apiVersion: v1, kind: ConfigMap, name: "{{ observability_kit_grafana_name }}-dashboards-aiops" }
    - { apiVersion: v1, kind: Secret, name: "{{ observability_kit_grafana_name }}-admin" }
  ignore_errors: true

- name: Remove Loki Deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ observability_kit_loki_name }}"
    namespace: "{{ observability_kit_namespace }}"
  ignore_errors: true

- name: Remove Loki ConfigMap and Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ observability_kit_namespace }}"
  loop:
    - { kind: ConfigMap, name: "{{ observability_kit_loki_name }}-config" }
    - { kind: Service, name: "{{ observability_kit_loki_name }}" }
  ignore_errors: true

- name: Remove Kafka topics
  kubernetes.core.k8s:
    state: absent
    api_version: kafka.strimzi.io/v1
    kind: KafkaTopic
    name: "{{ item }}"
    namespace: "{{ observability_kit_namespace }}"
  loop:
    - "{{ observability_kit_kafka_topic_alertmanager | replace('.', '-') }}"
    - "{{ observability_kit_kafka_topic_itsm | replace('.', '-') }}"
    - "{{ observability_kit_kafka_topic_aap_logs | replace('.', '-') }}"
  ignore_errors: true

- name: Remove Kafka cluster and node pool
  kubernetes.core.k8s:
    state: absent
    api_version: kafka.strimzi.io/v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ observability_kit_namespace }}"
  loop:
    - { kind: Kafka, name: "{{ observability_kit_kafka_cluster_name }}" }
    - { kind: KafkaNodePool, name: dual-role }
  ignore_errors: true

- name: Remove observability namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ observability_kit_namespace }}"
  ignore_errors: true
