---
- name: Lookup existing ITSM App Chat rulebook activation in EDA
  ansible.builtin.uri:
    url: >-
      {{ aap_eda_itsm_webhook_pipeline_controller_host }}/api/eda/v1/activations/?name={{
      aap_eda_itsm_webhook_pipeline_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
    status_code: 200
    return_content: true
  register: aap_eda_itsm_webhook_pipeline_activation_lookup

- name: Disable ITSM App Chat rulebook activation before recreate
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_itsm_webhook_pipeline_activation_name }}"
    organization_name: "{{ aap_eda_itsm_webhook_pipeline_organization }}"
    state: disabled
    controller_host: "{{ aap_eda_itsm_webhook_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
  when: aap_eda_itsm_webhook_pipeline_activation_lookup.json.count | default(0) | int > 0

- name: Wait until ITSM App Chat rulebook activation is stopped before delete
  ansible.builtin.uri:
    url: >-
      {{ aap_eda_itsm_webhook_pipeline_controller_host }}/api/eda/v1/activations/?name={{
      aap_eda_itsm_webhook_pipeline_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
    status_code: 200
    return_content: true
  register: aap_eda_itsm_webhook_pipeline_activation_stop_wait
  until: >
    (
      aap_eda_itsm_webhook_pipeline_activation_stop_wait.json.results
      | default([])
      | selectattr('name', 'equalto', aap_eda_itsm_webhook_pipeline_activation_name)
      | map(attribute='status')
      | list
      | first
      | default('stopped')
    ) in ['stopped', 'failed', 'disabled']
  retries: 30
  delay: 3
  when: aap_eda_itsm_webhook_pipeline_activation_lookup.json.count | default(0) | int > 0

- name: Remove existing ITSM App Chat rulebook activation before recreate
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_itsm_webhook_pipeline_activation_name }}"
    organization_name: "{{ aap_eda_itsm_webhook_pipeline_organization }}"
    state: absent
    controller_host: "{{ aap_eda_itsm_webhook_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
  when: aap_eda_itsm_webhook_pipeline_activation_lookup.json.count | default(0) | int > 0

- name: Wait until ITSM App Chat rulebook activation is removed from EDA
  ansible.builtin.uri:
    url: >-
      {{ aap_eda_itsm_webhook_pipeline_controller_host }}/api/eda/v1/activations/?name={{
      aap_eda_itsm_webhook_pipeline_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
    status_code: 200
    return_content: true
  register: aap_eda_itsm_webhook_pipeline_activation_delete_wait
  until: aap_eda_itsm_webhook_pipeline_activation_delete_wait.json.count | default(0) | int == 0
  retries: 30
  delay: 3
  when: aap_eda_itsm_webhook_pipeline_activation_lookup.json.count | default(0) | int > 0

- name: Ensure ITSM App Chat rulebook activation is present in EDA
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_itsm_webhook_pipeline_activation_name }}"
    description: Post itsm-app incident and service request notifications to chat via AAP (Kafka source)
    organization_name: "{{ aap_eda_itsm_webhook_pipeline_organization }}"
    project_name: "{{ aap_eda_itsm_webhook_pipeline_project }}"
    rulebook_name: "{{ aap_eda_itsm_webhook_pipeline_rulebook }}"
    decision_environment_name: "{{ aap_eda_itsm_webhook_pipeline_decision_environment }}"
    eda_credentials:
      - "{{ aap_eda_itsm_webhook_pipeline_controller_credential }}"
    state: present
    controller_host: "{{ aap_eda_itsm_webhook_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
  register: aap_eda_itsm_webhook_pipeline_activation_result

- name: Restart ITSM App Chat rulebook activation after project sync
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_itsm_webhook_pipeline_activation_name }}"
    organization_name: "{{ aap_eda_itsm_webhook_pipeline_organization }}"
    restart: true
    controller_host: "{{ aap_eda_itsm_webhook_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
  when:
    - aap_eda_activation_restart_on_run | default(true) | bool
    - aap_eda_itsm_webhook_pipeline_activation_lookup.json.count | default(0) | int > 0
    - not aap_eda_itsm_webhook_pipeline_activation_result is changed

- name: Wait for ITSM App Chat rulebook activation to reach running state
  ansible.builtin.uri:
    url: >-
      {{ aap_eda_itsm_webhook_pipeline_controller_host }}/api/eda/v1/activations/?name={{
      aap_eda_itsm_webhook_pipeline_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
    status_code: 200
    return_content: true
  register: aap_eda_itsm_webhook_pipeline_activation_status
  until: >
    (
      aap_eda_itsm_webhook_pipeline_activation_status.json.results
      | default([])
      | selectattr('name', 'equalto', aap_eda_itsm_webhook_pipeline_activation_name)
      | selectattr('status', 'equalto', 'running')
      | list
      | length
    ) > 0
  retries: 30
  delay: 5
