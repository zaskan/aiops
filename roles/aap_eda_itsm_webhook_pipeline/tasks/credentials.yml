---
- name: Ensure Basic Event Stream credential exists for ITSM webhook ingress
  ansible.eda.credential:
    name: "{{ aap_eda_itsm_webhook_pipeline_event_stream_credential }}"
    description: Basic auth for itsm-app outbound webhooks to EDA event stream
    credential_type_name: Basic Event Stream
    organization_name: "{{ aap_eda_itsm_webhook_pipeline_organization }}"
    inputs:
      username: "{{ aap_eda_itsm_webhook_pipeline_event_stream_username }}"
      password: "{{ aap_eda_itsm_webhook_pipeline_event_stream_password }}"
    state: present
    controller_host: "{{ aap_eda_itsm_webhook_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_itsm_webhook_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_itsm_webhook_pipeline_validate_certs }}"
  no_log: true
