---
- name: Read demo platform facts artifact from disk before merging ITSM Kafka EDA block
  ansible.builtin.slurp:
    src: "{{ aap_eda_itsm_webhook_pipeline_artifact_file }}"
  register: aap_eda_itsm_webhook_pipeline_artifact_slurp
  no_log: true

- name: Merge ITSM Kafka EDA facts into demo platform artifact
  ansible.builtin.set_fact:
    demo_platform_artifact_merged: >-
      {{
        (aap_eda_itsm_webhook_pipeline_artifact_slurp.content | b64decode | from_yaml).demo_platform | default({})
        | combine({
            'eda': (
              (aap_eda_itsm_webhook_pipeline_artifact_slurp.content | b64decode | from_yaml).demo_platform.eda | default({})
              | combine({
                  'itsm_webhook_activation_name': aap_eda_itsm_webhook_pipeline_activation_name,
                  'kafka_topic_itsm': aap_eda_itsm_webhook_pipeline_kafka_topic_itsm,
                })
            )
          }, recursive=True)
      }}
  no_log: true

- name: Update demo platform facts artifact with ITSM Kafka EDA details
  ansible.builtin.copy:
    dest: "{{ aap_eda_itsm_webhook_pipeline_artifact_file }}"
    mode: "0600"
    content: |
      ---
      demo_platform:
      {{ demo_platform_artifact_merged | to_nice_yaml(indent=2) | indent(2, first=True) }}
  no_log: true

- name: Refresh in-memory demo platform facts after ITSM EDA artifact update
  ansible.builtin.set_fact:
    demo_platform: "{{ demo_platform_artifact_merged }}"
  no_log: true
