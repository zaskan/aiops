---
- name: Reload demo platform facts artifact before merging ITSM Kafka EDA block
  ansible.builtin.include_vars:
    file: "{{ aap_eda_itsm_webhook_pipeline_artifact_file }}"
  no_log: true

- name: Merge ITSM Kafka EDA facts into demo platform artifact
  ansible.builtin.set_fact:
    demo_platform: >-
      {{
        demo_platform | combine({
          'eda': demo_platform.eda | default({}) | combine({
            'itsm_webhook_activation_name': aap_eda_itsm_webhook_pipeline_activation_name,
            'kafka_topic_itsm': aap_eda_itsm_webhook_pipeline_kafka_topic_itsm,
          })
        }, recursive=True)
      }}
  no_log: true

- name: Update demo platform facts artifact with ITSM Kafka EDA details
  ansible.builtin.copy:
    dest: "{{ aap_eda_itsm_webhook_pipeline_artifact_file }}"
    mode: "0600"
    content: |
      ---
      demo_platform:
      {{ demo_platform | to_nice_yaml(indent=2) | indent(2, first=True) }}
  no_log: true
