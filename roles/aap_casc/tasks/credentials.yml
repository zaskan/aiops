---
- name: Set list of credential names for summary
  ansible.builtin.set_fact:
    aap_casc_credential_names:
      - "{{ aap_casc_credential_openshift }}"
      - "{{ aap_casc_credential_aap }}"
      - "{{ aap_casc_credential_ah_published }}"
      - "{{ aap_casc_credential_ah_validated }}"
      - "{{ aap_casc_credential_chat }}"
      - "{{ aap_casc_credential_gitea }}"
      - "{{ aap_casc_credential_gitops }}"
      - "{{ aap_casc_credential_itsm }}"
      - "{{ aap_casc_credential_vms }}"

- name: Ensure OpenShift Cluster credential exists in AAP
  awx.awx.credential:
    name: "{{ aap_casc_credential_openshift }}"
    organization: "{{ aap_casc_organization }}"
    credential_type: OpenShift or Kubernetes API Bearer Token
    state: present
    inputs:
      host: "{{ demo_platform.openshift.api_server }}"
      bearer_token: "{{ aap_casc_openshift_bearer_token }}"
      verify_ssl: false
    controller_host: "{{ aap_casc_controller_host }}"
    controller_oauthtoken: "{{ aap_casc_controller_oauthtoken }}"
    validate_certs: "{{ aap_casc_validate_certs }}"
  no_log: true
  register: aap_controller_api_result
  until: aap_controller_api_result is succeeded
  retries: "{{ aap_controller_api_retries }}"
  delay: "{{ aap_controller_api_retry_delay }}"
- name: Ensure AAP Gateway credential exists in AAP
  awx.awx.credential:
    name: "{{ aap_casc_credential_aap }}"
    organization: "{{ aap_casc_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    state: present
    inputs:
      host: "{{ demo_platform.aap.gateway_url }}"
      username: "{{ demo_platform.aap.username }}"
      password: "{{ demo_platform.aap.password }}"
    controller_host: "{{ aap_casc_controller_host }}"
    controller_oauthtoken: "{{ aap_casc_controller_oauthtoken }}"
    validate_certs: "{{ aap_casc_validate_certs }}"
  no_log: true
  register: aap_controller_api_result
