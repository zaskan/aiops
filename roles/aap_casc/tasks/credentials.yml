  retries: "{{ aap_controller_api_retries }}"
  delay: "{{ aap_controller_api_retry_delay }}"
- name: Ensure Automation Hub Published Content credential exists in AAP
  awx.awx.credential:
    name: "{{ aap_casc_credential_ah_published }}"
    organization: "{{ aap_casc_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    state: present
    inputs:
      url: "{{ aap_casc_ah_published_url }}"
      auth_url: "{{ aap_casc_ah_auth_url }}"
      token: "{{ aap_casc_ah_offline_token }}"
    controller_host: "{{ aap_casc_controller_host }}"
    controller_oauthtoken: "{{ aap_casc_controller_oauthtoken }}"
