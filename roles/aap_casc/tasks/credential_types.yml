---
- name: Ensure Chat App custom credential type exists
  awx.awx.credential_type:
    name: Chat App
    kind: cloud
    state: present
    inputs:
      fields:
        - id: url
          type: string
          label: URL
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
      required:
        - url
        - username
        - password
    injectors:
      env:
        CHAT_APP_URL: "{{ '{{ url }}' }}"
        CHAT_APP_USERNAME: "{{ '{{ username }}' }}"
        CHAT_APP_PASSWORD: "{{ '{{ password }}' }}"
      extra_vars:
        chat_app_url: "{{ '{{ url }}' }}"
        chat_app_username: "{{ '{{ username }}' }}"
        chat_app_password: "{{ '{{ password }}' }}"
    controller_host: "{{ aap_casc_controller_host }}"
    controller_oauthtoken: "{{ aap_casc_controller_oauthtoken }}"
    validate_certs: "{{ aap_casc_validate_certs }}"

