- name: Ensure Itsm App custom credential type exists
  awx.awx.credential_type:
    name: Itsm App
    kind: cloud
    state: present
    inputs:
      fields:
        - id: url
          type: string
          label: URL
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: mcp_token
          type: string
          label: MCP Token
          secret: true
      required:
        - url
        - username
        - password
        - mcp_token
    injectors:
      env:
        ITSM_API_BASE_URL: "{{ '{{ url }}' }}"
        ITSM_API_USER: "{{ '{{ username }}' }}"
        ITSM_API_PASSWORD: "{{ '{{ password }}' }}"
        ITSM_VALIDATE_CERTS: "false"
      extra_vars:
        itsm_api_base_url: "{{ '{{ url }}' }}"
        itsm_api_user: "{{ '{{ username }}' }}"
        itsm_api_password: "{{ '{{ password }}' }}"
    controller_host: "{{ aap_casc_controller_host }}"
    controller_oauthtoken: "{{ aap_casc_controller_oauthtoken }}"
    validate_certs: "{{ aap_casc_validate_certs }}"
