---
- name: Ensure Apache Alert Incident rulebook activation is present in EDA
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_pipeline_activation_name }}"
    description: Open ITSM incidents when Apache HTTP probes fail (Kafka source)
    organization_name: "{{ aap_eda_pipeline_organization }}"
    project_name: "{{ aap_eda_pipeline_project }}"
    rulebook_name: "{{ aap_eda_pipeline_rulebook }}"
    decision_environment_name: "{{ aap_eda_pipeline_decision_environment }}"
    eda_credentials:
      - "{{ aap_eda_pipeline_controller_credential }}"
    state: present
    controller_host: "{{ aap_eda_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
  register: aap_eda_pipeline_activation_result

- name: Restart Apache alert rulebook activation after project sync or activation update
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_pipeline_activation_name }}"
    organization_name: "{{ aap_eda_pipeline_organization }}"
    restart: true
    controller_host: "{{ aap_eda_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
  when: >
    aap_eda_activation_restart_on_run | default(true) | bool
    or aap_eda_pipeline_activation_result is changed
    or aap_eda_pipeline_project_result is changed

- name: Wait for Apache alert rulebook activation to reach running state
  ansible.builtin.uri:
    url: >-
      {{ aap_eda_pipeline_controller_host }}/api/eda/v1/activations/?name={{
      aap_eda_pipeline_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
    status_code: 200
    return_content: true
  register: aap_eda_pipeline_activation_status
  until: >
    (
      aap_eda_pipeline_activation_status.json.results
      | default([])
      | selectattr('name', 'equalto', aap_eda_pipeline_activation_name)
      | selectattr('status', 'equalto', 'running')
      | list
      | length
    ) > 0
  retries: 30
  delay: 5
