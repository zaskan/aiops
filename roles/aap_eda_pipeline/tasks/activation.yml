---
- name: Recreate activation when Rulebooks project changed
  when: aap_eda_pipeline_project_result is changed
  block:
    - name: Remove Generic Application alert rulebook activation before remapping event streams
      ansible.eda.rulebook_activation:
        name: "{{ aap_eda_pipeline_activation_name }}"
        organization_name: "{{ aap_eda_pipeline_organization }}"
        state: absent
        controller_host: "{{ aap_eda_pipeline_controller_host }}"
        controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
        validate_certs: "{{ aap_eda_pipeline_validate_certs }}"

    - name: Wait until Generic Application alert rulebook activation is deleted
      ansible.builtin.uri:
        url: "{{ aap_eda_pipeline_controller_host }}/api/eda/v1/activations/"
        user: "{{ aap_eda_pipeline_controller_username }}"
        password: "{{ aap_eda_pipeline_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_eda_pipeline_validate_certs | bool }}"
        return_content: true
        status_code: [200]
      register: aap_eda_pipeline_activation_delete_wait
      until: >-
        {{
          aap_eda_pipeline_activation_delete_wait.json.results
          | default([])
          | selectattr('name', 'equalto', aap_eda_pipeline_activation_name)
          | list
          | length == 0
        }}
      retries: 30
      delay: 2

    - name: Ensure Generic Application alert rulebook activation exists in EDA
      ansible.eda.rulebook_activation:
        name: "{{ aap_eda_pipeline_activation_name }}"
        description: Open ITSM incidents when Generic Application HTTP probes fail
        organization_name: "{{ aap_eda_pipeline_organization }}"
        project_name: "{{ aap_eda_pipeline_project }}"
        rulebook_name: "{{ aap_eda_pipeline_rulebook }}"
        decision_environment_name: "{{ aap_eda_pipeline_decision_environment }}"
        eda_credentials:
          - "{{ aap_eda_pipeline_controller_credential }}"
        state: enabled
        event_streams:
          - event_stream: "{{ aap_eda_pipeline_event_stream_name }}"
            source_name: "{{ aap_eda_pipeline_rulebook_source_name }}"
        controller_host: "{{ aap_eda_pipeline_controller_host }}"
        controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
        validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
      register: aap_eda_pipeline_activation_recreate_result

- name: Ensure Generic Application alert rulebook activation exists in EDA
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_pipeline_activation_name }}"
    description: Open ITSM incidents when Generic Application HTTP probes fail
    organization_name: "{{ aap_eda_pipeline_organization }}"
    project_name: "{{ aap_eda_pipeline_project }}"
    rulebook_name: "{{ aap_eda_pipeline_rulebook }}"
    decision_environment_name: "{{ aap_eda_pipeline_decision_environment }}"
    eda_credentials:
      - "{{ aap_eda_pipeline_controller_credential }}"
    state: enabled
    event_streams:
      - event_stream: "{{ aap_eda_pipeline_event_stream_name }}"
        source_name: "{{ aap_eda_pipeline_rulebook_source_name }}"
    controller_host: "{{ aap_eda_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
  register: aap_eda_pipeline_activation_result
  when: not (aap_eda_pipeline_project_result is changed)

- name: Restart Generic Application alert rulebook activation after updates
  ansible.eda.rulebook_activation:
    name: "{{ aap_eda_pipeline_activation_name }}"
    organization_name: "{{ aap_eda_pipeline_organization }}"
    restart: true
    controller_host: "{{ aap_eda_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
  when:
    - aap_eda_pipeline_activation_result is changed
    - not (aap_eda_pipeline_project_result is changed)

- name: Wait for Generic Application alert rulebook activation to reach running state
  ansible.builtin.uri:
    url: "{{ aap_eda_pipeline_controller_host }}/api/eda/v1/activations/"
    user: "{{ aap_eda_pipeline_controller_username }}"
    password: "{{ aap_eda_pipeline_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_eda_pipeline_validate_certs | bool }}"
    return_content: true
    status_code: [200]
  register: aap_eda_pipeline_activation_status
  until: >-
    {{
      (
        aap_eda_pipeline_activation_status.json.results
        | default([])
        | selectattr('name', 'equalto', aap_eda_pipeline_activation_name)
        | list
        | first
        | default({})
      ).status | default('') == 'running'
    }}
  retries: 30
  delay: 5
