---
# AAP 2.7 gateway: rulebook activations must use oauth_token only. Username/password
# combined with the worker's controller token causes ansible-rulebook to fail with:
# "Cannot combine AUTHORIZATION header with AUTH argument or credentials encoded in URL".

- name: Ensure AAP Controller credential exists in EDA
  block:
    - ansible.eda.credential:
        name: "{{ aap_eda_pipeline_controller_credential }}"
        description: AAP gateway OAuth token for EDA rulebook job template launches
        credential_type_name: Red Hat Ansible Automation Platform
        organization_name: "{{ aap_eda_pipeline_organization }}"
        inputs:
          host: >-
            {{
              (aap_eda_pipeline_controller_host | regex_replace('/$', ''))
              ~ (aap_eda_pipeline_controller_credential_host_suffix | default('/api/controller/'))
            }}
          oauth_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
          username: ""
          password: ""
          verify_ssl: "{{ aap_eda_pipeline_validate_certs | bool }}"
        state: present
        controller_host: "{{ aap_eda_pipeline_controller_host }}"
        controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
        validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
      register: aap_eda_pipeline_controller_credential_result
      no_log: true
      retries: 3
      delay: 5
      until: not aap_eda_pipeline_controller_credential_result.failed | default(false)
  rescue:
    - name: Report EDA AAP Controller credential failure
      ansible.builtin.fail:
        msg: >-
          Could not create or update EDA credential '{{ aap_eda_pipeline_controller_credential }}'
          (Red Hat Ansible Automation Platform) in organization
          '{{ aap_eda_pipeline_organization }}'.
          {{ ansible_failed_result.msg | default(ansible_failed_result) }}
