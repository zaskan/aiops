---
- name: Reload demo platform facts artifact before merging EDA block
  ansible.builtin.include_vars:
    file: "{{ aap_eda_pipeline_artifact_file }}"
  no_log: true

- name: Merge EDA Kafka facts into demo platform artifact
  ansible.builtin.set_fact:
    demo_platform: >-
      {{
        demo_platform | combine({
          'eda': {
            'url': aap_eda_pipeline_eda_url,
            'activation_name': aap_eda_pipeline_activation_name,
            'project': aap_eda_pipeline_project,
            'controller_api_host': (
              (aap_eda_pipeline_controller_host | regex_replace('/$', ''))
              ~ (aap_eda_pipeline_controller_credential_host_suffix | default('/api/controller/'))
            ),
            'kafka_bootstrap': aap_eda_pipeline_kafka_bootstrap,
            'kafka_topic_alertmanager': aap_eda_pipeline_kafka_topic_alertmanager,
          }
        }, recursive=True)
      }}
  no_log: true

- name: Update demo platform facts artifact with EDA Kafka details
  ansible.builtin.copy:
    dest: "{{ aap_eda_pipeline_artifact_file }}"
    mode: "0600"
    content: |
      ---
      demo_platform:
      {{ demo_platform | to_nice_yaml(indent=2) | indent(2, first=True) }}
  no_log: true
