---
- name: Read demo platform facts artifact from disk before merging EDA block
  ansible.builtin.slurp:
    src: "{{ aap_eda_pipeline_artifact_file }}"
  register: aap_eda_pipeline_artifact_slurp
  no_log: true

- name: Merge EDA Kafka facts into demo platform artifact
  ansible.builtin.set_fact:
    demo_platform_artifact_merged: >-
      {{
        (aap_eda_pipeline_artifact_slurp.content | b64decode | from_yaml).demo_platform | default({})
        | combine({
            'eda': {
              'url': aap_eda_pipeline_eda_url,
              'activation_name': aap_eda_pipeline_activation_name,
              'project': aap_eda_pipeline_project,
              'controller_api_host': (
                (aap_eda_pipeline_controller_host | regex_replace('/$', ''))
                ~ (aap_eda_pipeline_controller_credential_host_suffix | default('/api/controller/'))
              ),
              'kafka_bootstrap': aap_eda_pipeline_kafka_bootstrap,
              'kafka_topic_alertmanager': aap_eda_pipeline_kafka_topic_alertmanager,
            }
          }, recursive=True)
      }}
  no_log: true

- name: Update demo platform facts artifact with EDA Kafka details
  ansible.builtin.copy:
    dest: "{{ aap_eda_pipeline_artifact_file }}"
    mode: "0600"
    content: |
      ---
      demo_platform:
      {{ demo_platform_artifact_merged | to_nice_yaml(indent=2) | indent(2, first=True) }}
  no_log: true

- name: Refresh in-memory demo platform facts after EDA artifact update
  ansible.builtin.set_fact:
    demo_platform: "{{ demo_platform_artifact_merged }}"
  no_log: true
