---
- name: Run AAP Apache stack pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Configure AAP master workflow for Apache Application stack
  block:
    - name: Ensure Deploy Apache Application Stack master workflow exists
      ansible.builtin.include_tasks: workflow.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_apache_stack_pipeline_controller_api_prefix }}"

- name: Display AAP Apache stack pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_apache_stack_pipeline_organization }}"
      - "Master workflow: {{ aap_apache_stack_pipeline_workflow }}"
      - "Sub-workflows: {{ aap_apache_stack_pipeline_vm_subworkflow }} → {{ aap_apache_stack_pipeline_httpd_subworkflow }}"
