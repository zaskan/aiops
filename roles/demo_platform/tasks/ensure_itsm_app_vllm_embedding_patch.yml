---
- name: Read itsm-app kb_embeddings patches from running pod
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - exec
      - deployment/itsm-app
      - --
      - grep
      - -E
      - encoding_format|\[:1200\]
      - /app/app/services/kb_embeddings.py
  register: itsm_app_embedding_patch_check
  changed_when: false
  failed_when: false
  when: itsm_app_vllm_embedding_patch | default(true) | bool

- name: Rebuild itsm-app image with vLLM embedding payload patch
  ansible.builtin.include_tasks: build_itsm_app_image.yml
  when:
    - itsm_app_vllm_embedding_patch | default(true) | bool
    - (itsm_app_embedding_patch_check.stdout | default('') | regex_search('encoding_format')) is none
      or (itsm_app_embedding_patch_check.stdout | default('') | regex_search('\\[:1200\\]')) is none

- name: Rollout restart itsm-app after vLLM embedding patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - rollout
      - restart
      - deployment/itsm-app
  when:
    - itsm_app_vllm_embedding_patch | default(true) | bool
    - (itsm_app_embedding_patch_check.stdout | default('') | regex_search('encoding_format')) is none
      or (itsm_app_embedding_patch_check.stdout | default('') | regex_search('\\[:1200\\]')) is none
  changed_when: true

- name: Wait for itsm-app rollout after vLLM embedding patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - rollout
      - status
      - deployment/itsm-app
      - --timeout=300s
  changed_when: false
  when:
    - itsm_app_vllm_embedding_patch | default(true) | bool
    - (itsm_app_embedding_patch_check.stdout | default('') | regex_search('encoding_format')) is none
      or (itsm_app_embedding_patch_check.stdout | default('') | regex_search('\\[:1200\\]')) is none
