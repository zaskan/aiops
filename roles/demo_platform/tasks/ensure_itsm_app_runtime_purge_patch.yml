---
- name: Read itsm-app runtime purge patch markers from running pod
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - exec
      - deployment/itsm-app
      - --
      - grep
      - -E
      - purge-runtime-data|RUNTIME_PURGE_CONFIRM_PHRASE
      - /app/app/routes/api_v1.py
      - /app/app/services/runtime_purge.py
  register: itsm_app_runtime_purge_patch_check
  changed_when: false
  failed_when: false
  when: itsm_app_runtime_purge_patch | default(true) | bool

- name: Rebuild itsm-app image with runtime purge API for platform reset
  ansible.builtin.include_tasks: build_itsm_app_image.yml
  when:
    - itsm_app_runtime_purge_patch | default(true) | bool
    - (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('purge-runtime-data')) is none
      or (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('RUNTIME_PURGE_CONFIRM_PHRASE')) is none

- name: Rollout restart itsm-app after runtime purge patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - rollout
      - restart
      - deployment/itsm-app
  when:
    - itsm_app_runtime_purge_patch | default(true) | bool
    - (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('purge-runtime-data')) is none
      or (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('RUNTIME_PURGE_CONFIRM_PHRASE')) is none
  changed_when: true

- name: Wait for itsm-app rollout after runtime purge patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_app_namespace }}"
      - rollout
      - status
      - deployment/itsm-app
      - --timeout=600s
  changed_when: false
  when:
    - itsm_app_runtime_purge_patch | default(true) | bool
    - (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('purge-runtime-data')) is none
      or (itsm_app_runtime_purge_patch_check.stdout | default('') | regex_search('RUNTIME_PURGE_CONFIRM_PHRASE')) is none
