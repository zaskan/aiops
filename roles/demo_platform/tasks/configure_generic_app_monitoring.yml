---
- name: Remove legacy Apache monitoring alert resources
  ansible.builtin.include_tasks: uninstall_apache_monitoring.yml
  vars:
    openshift_apache_monitoring_namespace: aiops-demo
    openshift_apache_monitoring_alertmanager_config_name: apache-alert-to-eda
    openshift_apache_monitoring_prometheus_rule_name: apache-http-probes
    openshift_apache_monitoring_eda_webhook_secret_name: eda-apache-alert-webhook

- name: Load demo platform facts artifact for Generic Application monitoring
  ansible.builtin.include_vars:
    file: "{{ demo_platform_artifacts_file | default(demo_platform_artifacts_dir ~ '/demo_platform_facts.yml') }}"

- name: Resolve EDA event stream webhook URL for Alertmanager
  ansible.builtin.include_tasks: resolve_eda_event_stream_url.yml

- name: Enable OpenShift user-workload monitoring and alerting when needed
  ansible.builtin.include_tasks: enable_uwm_alerting.yml

- name: Fail when user-workload alerting is not enabled
  ansible.builtin.fail:
    msg: >-
      OpenShift user-workload alerting is not available. Ensure
      cluster-monitoring-config has enableUserWorkload: true and
      user-workload-monitoring-config has alertmanager.enabled and
      alertmanager.enableAlertmanagerConfig set to true. Set
      openshift_generic_app_monitoring_enable_uwm: true (default) to apply
      these settings automatically.
  when:
    - openshift_generic_app_monitoring_require_uwm | bool
    - not openshift_generic_app_monitoring_uwm_alerting_enabled | bool

- name: Deploy blackbox exporter for Generic Application HTTP probes
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'openshift_blackbox_exporter.yaml.j2') | from_yaml_all | list }}"

- name: List HTTP Probe resources in Generic Application monitoring namespace
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: Probe
    namespace: "{{ openshift_generic_app_monitoring_namespace }}"
  register: openshift_generic_app_monitoring_probes

- name: Point HTTP Probe resources at generic-app-http job and blackbox exporter
  kubernetes.core.k8s:
    state: present
    merge_type: merge
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ openshift_generic_app_monitoring_namespace }}"
      spec:
        jobName: "{{ openshift_generic_app_monitoring_probe_job }}"
        interval: "{{ openshift_generic_app_monitoring_probe_interval }}"
        prober:
          url: "{{ openshift_generic_app_monitoring_blackbox_prober }}"
  loop: "{{ openshift_generic_app_monitoring_probes.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: openshift_generic_app_monitoring_probes.resources | default([]) | length > 0

- name: Ensure aiops-demo namespace has user-monitoring label
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ openshift_generic_app_monitoring_namespace }}"
        labels:
          openshift.io/user-monitoring: "true"
    merge_type: merge

- name: Create Secret for Alertmanager webhook basic auth to EDA event stream
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ openshift_generic_app_monitoring_eda_webhook_secret_name }}"
        namespace: "{{ openshift_generic_app_monitoring_namespace }}"
      type: Opaque
      stringData:
        username: "{{ openshift_generic_app_monitoring_eda_webhook_username }}"
        password: "{{ openshift_generic_app_monitoring_eda_webhook_password }}"
  no_log: true

- name: Apply PrometheusRule for Generic Application HTTP probe failures
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'openshift_generic_app_prometheus_rule.yaml.j2') | from_yaml }}"

- name: Apply AlertmanagerConfig routing Generic Application alerts to EDA
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'openshift_generic_app_alertmanager_config.yaml.j2') | from_yaml }}"

- name: Display Generic Application monitoring configuration summary
  ansible.builtin.debug:
    msg:
      - "Namespace: {{ openshift_generic_app_monitoring_namespace }}"
      - "PrometheusRule: {{ openshift_generic_app_monitoring_prometheus_rule_name }}"
      - "Alert: {{ openshift_generic_app_monitoring_alert_name }}"
      - "AlertmanagerConfig: {{ openshift_generic_app_monitoring_alertmanager_config_name }}"
      - "EDA webhook: {{ openshift_generic_app_monitoring_eda_webhook_url }}"
