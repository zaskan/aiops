---
- name: Load demo platform facts artifact for ITSM VM modification templates
  ansible.builtin.include_vars:
    file: "{{ demo_platform_artifacts_file | default(demo_platform_artifacts_dir ~ '/demo_platform_facts.yml') }}"

- name: Map itsm-app API connection from artifact
  ansible.builtin.set_fact:
    itsm_api_base_url: "{{ demo_platform.itsm_app.url }}"
    itsm_api_user: "{{ demo_platform.itsm_app.username }}"
    itsm_api_password: "{{ demo_platform.itsm_app.password }}"
    itsm_validate_certs: false
  no_log: true

- name: GET existing ITSM KB articles for task template linking
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/kb/articles"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: itsm_vm_modification_kb_list
  until: itsm_vm_modification_kb_list is succeeded
  retries: "{{ itsm_http_retries }}"
  delay: "{{ itsm_http_retry_delay }}"
- name: Build KB title to id map for task template linking
  ansible.builtin.set_fact:
    itsm_kb_by_title: >-
      {{
        dict(
          itsm_vm_modification_kb_list.json
          | default([])
          | map(attribute='title')
          | zip(
              itsm_vm_modification_kb_list.json
              | default([])
              | map(attribute='id')
            )
          | list
        )
      }}

- name: Configure ITSM VM modification task, change, and request templates
  ansible.builtin.include_role:
    name: demos.utils.itsm_ansible_role
  vars:
    itsm_ansible_role_check_connection: true
    itsm_ansible_role_admin_settings: false
    itsm_ansible_role_users: false
    itsm_ansible_role_asset_types: false
    itsm_ansible_role_assets: false
    itsm_ansible_role_inventory: false
    itsm_ansible_role_kb: false
    itsm_ansible_role_incidents: false
    itsm_ansible_role_followups: false
    itsm_ansible_role_task_templates: true
    itsm_ansible_role_change_templates: true
    itsm_ansible_role_request_templates: true
    itsm_ansible_role_service_requests: false
    itsm_ansible_role_changes: false
    itsm_ansible_role_change_tasks: false
    itsm_task_templates: "{{ itsm_vm_modification_task_templates }}"
    itsm_change_templates: "{{ itsm_vm_modification_change_templates }}"
    itsm_request_templates: "{{ itsm_vm_modification_request_templates }}"

- name: Ensure VM modification change templates include all workflow CTASK templates
  ansible.builtin.include_tasks: sync_itsm_vm_modification_change_template.yml

- name: Sync VM modification request template flags on existing catalog items
  ansible.builtin.include_tasks: sync_itsm_request_template_flags.yml
  vars:
    itsm_request_template_flag_sync_list: "{{ itsm_vm_modification_request_templates }}"
