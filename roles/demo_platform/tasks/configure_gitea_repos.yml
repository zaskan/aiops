---
- name: Check demo platform facts artifact exists
  ansible.builtin.stat:
    path: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"
  register: demo_platform_artifacts_stat

- name: Fail when demo platform facts artifact is missing
  ansible.builtin.fail:
    msg: >-
      artifacts/demo_platform_facts.yml not found. Run
      playbooks/install.yml first to generate platform facts.
  when: not demo_platform_artifacts_stat.stat.exists

- name: Load demo platform facts artifact
  ansible.builtin.include_vars:
    file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Map Gitea API connection from artifact
  ansible.builtin.set_fact:
    gitea_api_base: "{{ demo_platform.gitea.url }}"
    gitea_admin_username: "{{ demo_platform.gitea.username }}"
    gitea_admin_password: "{{ demo_platform.gitea.password }}"
  no_log: true

- name: Resolve Gitea repository sync sources
  ansible.builtin.set_fact:
    gitea_repos_seeds: "{{ gitea_repos_seeds | default([]) + [gitea_repos_seed_entry] }}"
  loop: "{{ gitea_repos_sync_repo_defs }}"
  loop_control:
    loop_var: repo
    label: "{{ repo.name }}"
  when:
    - not (repo.skip_sync | default(false) | bool)
    - gitea_repos_sync_only | default([]) | length == 0 or repo.name in gitea_repos_sync_only
  vars:
    gitea_repos_seed_entry: >-
      {{
        {'name': repo.name, 'source_path': gitea_repos_local_base ~ '/' ~ repo.local_dir}
        | combine(
            {'preserve_paths': repo.preserve_paths}
            if repo.preserve_paths is defined else {}
          )
        if repo.local_dir is defined
        else {
          'name': repo.name,
          'source_url': repo.source_url,
          'branch': repo.branch | default(gitea_repos_default_branch)
        }
      }}

- name: Provision Gitea repositories
  ansible.builtin.include_role:
    name: gitea_repos
