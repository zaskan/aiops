---
- name: Verify ITSM KB semantic search after article publish
  ansible.builtin.include_tasks: verify_itsm_kb_rag_attempt.yml

- name: Retry ITSM KB semantic search verification
  ansible.builtin.include_tasks: verify_itsm_kb_rag.yml
  when:
    - not (itsm_kb_rag_verify_passed | default(false))
    - (itsm_kb_rag_verify_attempt | default(0) | int) <= 12
