---
- name: Verify OpenShift cluster access
  ansible.builtin.include_tasks: check_openshift.yml

- name: Verify Ansible Automation Platform 2.7
  ansible.builtin.include_tasks: check_aap.yml

- name: Enable and verify Ansible MCP server on discovered AAP instance
  ansible.builtin.include_tasks: install_aap_mcp.yml
  when: aap_mcp_enabled | default(true) | bool

- name: Verify OpenShift GitOps
  ansible.builtin.include_tasks: check_gitops.yml

- name: Verify OpenShift Virtualization
  ansible.builtin.include_tasks: check_virt.yml

- name: Verify OVN UserDefinedNetwork support for VM fixed IPs
  ansible.builtin.include_tasks: check_vm_fixed_ip_network.yml

- name: Ensure itsm-app is installed and healthy
  ansible.builtin.include_tasks: install_itsm_app.yml

- name: Ensure chat-app is installed and healthy
  ansible.builtin.include_tasks: install_chat_app.yml

- name: Ensure gitea is installed and healthy
  ansible.builtin.include_tasks: install_gitea.yml

- name: Prepare aiops-demo namespace and VM SSH secret
  ansible.builtin.include_tasks: prepare_aiops_demo_vms.yml

- name: Prepare aiops-demo secondary UDN for VM fixed IPs
  ansible.builtin.include_tasks: prepare_aiops_demo_udn.yml

- name: Publish demo platform facts
  ansible.builtin.include_tasks: set_demo_facts.yml

- name: Configure chat-app for AIOps demo
  ansible.builtin.include_tasks: configure_chat_aiops.yml

- name: Ensure itsm-agent bot is installed and configured
  ansible.builtin.include_tasks: install_itsm_agent.yml
  when: itsm_agent_enabled | default(true) | bool

- name: Configure AAP AIOps organization and credentials
  ansible.builtin.include_role:
    name: aap_casc
  vars:
    aap_casc_artifact_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Sync Gitea repositories for AAP playbooks SCM
  ansible.builtin.include_tasks: configure_gitea_repos.yml
  vars:
    gitea_repos_local_base: "{{ playbook_dir }}/casc"

- name: Configure AAP VM provisioning workflow
  ansible.builtin.include_role:
    name: aap_vm_pipeline
  vars:
    aap_vm_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Enable ITSM KB semantic search before publishing articles
  ansible.builtin.include_tasks: configure_itsm_app_rag.yml
  when: itsm_app_rag_enabled | default(true) | bool

# itsm-app stores SQLite on emptyDir; configure_itsm_app_rag may rebuild/restart the pod.
# Seed ITSM DB content only after the last restart during install.
- name: Configure itsm-app for AIOps demo
  ansible.builtin.include_tasks: configure_itsm_aiops.yml

- name: Configure ITSM asset types (Virtual Machine, Generic Application)
  ansible.builtin.include_tasks: configure_itsm_asset_types.yml

- name: Publish ITSM KB article for VM provisioning workflow
  ansible.builtin.include_tasks: configure_itsm_kb_vm_provisioning.yml

- name: Publish ITSM KB article for VM CPU modification workflow
  ansible.builtin.include_tasks: configure_itsm_kb_vm_cpu_modification.yml

- name: Publish ITSM KB article for VM memory modification workflow
  ansible.builtin.include_tasks: configure_itsm_kb_vm_memory_modification.yml

- name: Publish ITSM KB article for Generic Application incident remediation
  ansible.builtin.include_tasks: configure_itsm_kb_generic_app_incident_remediation.yml

- name: Publish ITSM KB article for Generic Application stack deletion
  ansible.builtin.include_tasks: configure_itsm_kb_generic_app_deletion.yml

- name: Configure ITSM Generic Application stack templates
  ansible.builtin.include_tasks: configure_itsm_generic_app_stack_templates.yml

- name: Configure ITSM Generic Application delete catalog templates
  ansible.builtin.include_tasks: configure_itsm_generic_app_delete_templates.yml

- name: Configure ITSM VM modification catalog templates
  ansible.builtin.include_tasks: configure_itsm_vm_modification_templates.yml

- name: Configure AAP Generic Application deployment workflow
  ansible.builtin.include_role:
    name: aap_generic_app_pipeline
  vars:
    aap_generic_app_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Configure Event-Driven Ansible Generic Application alert pipeline
  ansible.builtin.include_role:
    name: aap_eda_pipeline
  vars:
    aap_eda_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Configure OpenShift monitoring alerts for Generic Application HTTP probes
  ansible.builtin.include_tasks: configure_generic_app_monitoring.yml

- name: Configure AAP Deploy Generic Application Stack master workflow
  ansible.builtin.include_role:
    name: aap_generic_app_stack_pipeline
  vars:
    aap_generic_app_stack_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Configure AAP Delete Generic Application Stack workflow
  ansible.builtin.include_role:
    name: aap_generic_app_delete_pipeline
  vars:
    aap_generic_app_delete_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"

- name: Configure AAP VM modification workflows
  ansible.builtin.include_role:
    name: aap_vm_modification_pipeline
  vars:
    aap_vm_modification_pipeline_artifacts_file: "{{ demo_platform_artifacts_dir }}/demo_platform_facts.yml"
