---
- name: Verify UserDefinedNetwork CRD is installed
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: userdefinednetworks.k8s.ovn.org
  register: demo_udn_crd

- name: Fail when UserDefinedNetwork CRD is missing
  ansible.builtin.fail:
    msg: >-
      VM fixed IP provisioning requires the UserDefinedNetwork API
      (userdefinednetworks.k8s.ovn.org). Install or upgrade to OpenShift Container
      Platform 4.17 or later with OVN-Kubernetes. Legacy OpenShift SDN clusters are
      not supported.
  when: demo_udn_crd.resources | default([]) | length == 0

- name: Get cluster network type
  ansible.builtin.command: oc get network.config cluster -o jsonpath='{.status.networkType}'
  register: demo_cluster_network_type
  changed_when: false

- name: Fail when cluster is not using OVN-Kubernetes
  ansible.builtin.fail:
    msg: >-
      VM fixed IP provisioning requires OVN-Kubernetes as the default CNI. Cluster
      network type is '{{ demo_cluster_network_type.stdout | trim }}'. Migrate to
      OVN-Kubernetes or use a cluster that already runs it.
  when: demo_cluster_network_type.stdout | trim != 'OVNKubernetes'

- name: Set VM fixed IP network preflight facts
  ansible.builtin.set_fact:
    openshift_vm_fixed_ip_network_available: true
    openshift_cluster_network_type: "{{ demo_cluster_network_type.stdout | trim }}"
