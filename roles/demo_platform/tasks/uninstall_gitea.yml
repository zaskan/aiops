---
- name: Check whether gitea namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ gitea_namespace }}"
  register: demo_gitea_ns_info

- name: Skip gitea uninstall when namespace is absent
  ansible.builtin.debug:
    msg: "gitea namespace '{{ gitea_namespace }}' not found; skipping."
  when: demo_gitea_ns_info.resources | length == 0

- name: Uninstall gitea workloads but keep PVCs
  when:
    - demo_gitea_ns_info.resources | length > 0
    - uninstall_keep_gitea_data | bool
  block:
    - name: Delete gitea workloads and configuration
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.apiVersion }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ gitea_namespace }}"
        wait: true
        wait_timeout: 300
      loop:
        - { apiVersion: apps/v1, kind: Deployment, name: gitea }
        - { apiVersion: apps/v1, kind: Deployment, name: postgres }
        - { apiVersion: v1, kind: Service, name: gitea-http }
        - { apiVersion: v1, kind: Service, name: postgres }
        - { apiVersion: route.openshift.io/v1, kind: Route, name: gitea }
        - { apiVersion: v1, kind: ConfigMap, name: gitea-config }
        - { apiVersion: v1, kind: ConfigMap, name: gitea-host-config }
        - { apiVersion: v1, kind: ConfigMap, name: gitea-cert-config }
        - { apiVersion: v1, kind: Secret, name: postgres-secret }
        - { apiVersion: v1, kind: Secret, name: gitea-secret }
        - { apiVersion: v1, kind: ServiceAccount, name: gitea }
      ignore_errors: true

- name: Delete gitea namespace and all resources
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ gitea_namespace }}"
    wait: true
    wait_timeout: 600
  when:
    - demo_gitea_ns_info.resources | length > 0
    - not uninstall_keep_gitea_data | bool or uninstall_delete_gitea_namespace | bool
