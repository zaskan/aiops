---
- name: Load demo platform facts artifact for ITSM KB article
  ansible.builtin.include_vars:
    file: "{{ demo_platform_artifacts_file | default(demo_platform_artifacts_dir ~ '/demo_platform_facts.yml') }}"

- name: Map itsm-app API connection from artifact
  ansible.builtin.set_fact:
    itsm_api_base_url: "{{ demo_platform.itsm_app.url }}"
    itsm_api_user: "{{ demo_platform.itsm_app.username }}"
    itsm_api_password: "{{ demo_platform.itsm_app.password }}"
    itsm_validate_certs: false
  no_log: true

- name: Render ITSM KB article body for generic application stack deletion
  ansible.builtin.set_fact:
    itsm_kb_generic_app_deletion_description: >-
      {{ lookup('template', 'itsm_kb_delete_generic_app.md.j2') }}

- name: GET existing ITSM KB articles
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/kb/articles"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    return_content: true
    status_code: [200]
    headers:
      Accept: application/json
  register: itsm_kb_generic_app_deletion_list

- name: Resolve existing KB article id by title
  ansible.builtin.set_fact:
    itsm_kb_generic_app_deletion_existing_id: >-
      {{
        (
          itsm_kb_generic_app_deletion_list.json
          | default([])
          | selectattr('title', 'equalto', itsm_kb_generic_app_deletion_title)
          | list
          | first
          | default({}, true)
        ).id | default(none, true)
      }}

- name: Update existing ITSM KB article for generic application stack deletion
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/kb/articles/{{ itsm_kb_generic_app_deletion_existing_id }}"
    method: PATCH
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    follow_redirects: all
    body_format: json
    body:
      title: "{{ itsm_kb_generic_app_deletion_title }}"
      description: "{{ itsm_kb_generic_app_deletion_description }}"
    status_code: [200]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_kb_generic_app_deletion_update
  when: itsm_kb_generic_app_deletion_existing_id is not none and itsm_kb_generic_app_deletion_existing_id | string | length > 0

- name: Create ITSM KB article for generic application stack deletion
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/kb/articles"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    follow_redirects: all
    body_format: json
    body:
      title: "{{ itsm_kb_generic_app_deletion_title }}"
      description: "{{ itsm_kb_generic_app_deletion_description }}"
    status_code: [201]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_kb_generic_app_deletion_create
  when: itsm_kb_generic_app_deletion_existing_id is none or itsm_kb_generic_app_deletion_existing_id | string | length == 0

- name: Record ITSM KB article id from upsert response
  ansible.builtin.set_fact:
    itsm_kb_generic_app_deletion_article_id: >-
      {{
        itsm_kb_generic_app_deletion_update.json.id
        | default(itsm_kb_generic_app_deletion_create.json.id)
        | default(itsm_kb_generic_app_deletion_existing_id)
      }}
    itsm_kb_generic_app_deletion_was_update: >-
      {{ itsm_kb_generic_app_deletion_existing_id is not none and itsm_kb_generic_app_deletion_existing_id | string | length > 0 }}

- name: Display ITSM KB article publish summary
  ansible.builtin.debug:
    msg:
      - >-
        ITSM KB article {{ 'updated' if itsm_kb_generic_app_deletion_was_update | bool else 'created' }}:
        {{ itsm_kb_generic_app_deletion_title }} (id {{ itsm_kb_generic_app_deletion_article_id }})
      - "ITSM URL: {{ demo_platform.itsm_app.url }}/kb"

- name: Re-index ITSM KB article for semantic search
  ansible.builtin.include_tasks: reindex_itsm_kb_generic_app_deletion.yml
  when: itsm_app_rag_enabled | default(true) | bool

- name: Verify published KB article is indexed for semantic search
  ansible.builtin.include_tasks: verify_itsm_kb_generic_app_deletion_rag.yml
  when: itsm_app_rag_enabled | default(true) | bool
