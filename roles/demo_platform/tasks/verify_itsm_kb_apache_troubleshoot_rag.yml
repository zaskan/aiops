---
- name: Verify ITSM KB semantic search after Apache troubleshoot article publish
  ansible.builtin.uri:
    url: "{{ demo_platform.itsm_app.url }}/mcp/"
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
      X-ITSM-MCP-Token: "{{ demo_platform.itsm_app.mcp_token }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: tools/call
      params:
        name: rag_search_kb
        arguments:
          query: "{{ itsm_kb_apache_troubleshoot_title }}"
          top_k: 3
    validate_certs: false
    status_code: 200
    return_content: true
  register: itsm_kb_apache_troubleshoot_rag_verify
  retries: 12
  delay: 5
  until: >-
    itsm_kb_apache_troubleshoot_rag_verify.status == 200
    and 'rag_not_configured' not in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))
    and 'embedding_failed' not in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))
    and 'no_indexed_articles' not in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))
    and itsm_kb_apache_troubleshoot_title in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))

- name: Fail when Apache troubleshoot KB article is not reachable via semantic search
  ansible.builtin.fail:
    msg: >-
      ITSM KB article '{{ itsm_kb_apache_troubleshoot_title }}' was not returned by
      rag_search_kb. Re-run configure_itsm_kb_apache_troubleshoot.yml to re-index.
  when: >-
    'embedding_failed' not in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))
    and itsm_kb_apache_troubleshoot_title not in (itsm_kb_apache_troubleshoot_rag_verify.content | default(''))
