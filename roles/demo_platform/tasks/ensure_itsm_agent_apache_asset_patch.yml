---
- name: Read itsm-agent patch markers from running pod
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_agent_namespace }}"
      - exec
      - deployment/itsm-agent
      - --
      - grep
      - -E
      - enrich_collected_from_apache_asset|apache_app_rpm_packages|lightspeed_incident_reply|ensure_lightspeed_playbook_in_collected|apache_troubleshoot_path_applies|refresh_incident_session_template|lightspeed_playbook_review_reply|_present_lightspeed_playbook|lightspeed_api_url|status in \(401, 404, 503\)
      - /app/bot/runner.py
      - /app/bot/apache_assets.py
      - /app/bot/lightspeed_remediation.py
  register: itsm_agent_patch_check
  changed_when: false
  failed_when: false

- name: Rebuild itsm-agent image with demo platform patches
  ansible.builtin.include_tasks: build_itsm_agent_image.yml
  when: >-
    (itsm_agent_apache_asset_extra_vars_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('enrich_collected_from_apache_asset')) is none)
    or
    (itsm_agent_lightspeed_remediation_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('status in \\(401, 404, 503\\)')) is none)

- name: Rollout restart itsm-agent after patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_agent_namespace }}"
      - rollout
      - restart
      - deployment/itsm-agent
  when: >-
    (itsm_agent_apache_asset_extra_vars_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('enrich_collected_from_apache_asset')) is none)
    or
    (itsm_agent_lightspeed_remediation_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('status in \\(401, 404, 503\\)')) is none)
  changed_when: true

- name: Wait for itsm-agent rollout after patch rebuild
  ansible.builtin.command:
    argv:
      - oc
      - "-n"
      - "{{ itsm_agent_namespace }}"
      - rollout
      - status
      - deployment/itsm-agent
      - --timeout=300s
  changed_when: false
  when: >-
    (itsm_agent_apache_asset_extra_vars_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('enrich_collected_from_apache_asset')) is none)
    or
    (itsm_agent_lightspeed_remediation_patch | default(true) | bool
    and (itsm_agent_patch_check.stdout | default('') | regex_search('status in \\(401, 404, 503\\)')) is none)
