---
- name: Load demo platform facts artifact for ITSM collector webhook configuration
  ansible.builtin.include_tasks: load_demo_platform_artifact.yml

- name: Map itsm-app and chat API connections
  ansible.builtin.set_fact:
    itsm_api_base_url: "{{ demo_platform.itsm_app.url }}"
    itsm_api_user: "{{ demo_platform.itsm_app.username }}"
    itsm_api_password: "{{ demo_platform.itsm_app.password }}"
    itsm_validate_certs: false
    chat_api_base: "{{ demo_platform.chat_app.url }}"
    chat_admin_username: "{{ demo_platform.chat_app.username }}"
    chat_admin_password: "{{ demo_platform.chat_app.password }}"
  no_log: true

- name: Resolve ITSM webhook OTel Collector facts from artifact
  ansible.builtin.set_fact:
    itsm_collector_webhook_base_url: >-
      {{
        (demo_platform.observability | default({}, true)).collector_itsm_url | default('') | string | trim
        if ((demo_platform.observability | default({}, true)).collector_itsm_url | default('') | string | trim | length) > 0
        else (
          'http://'
          ~ observability_kit_collector_internal_host
          ~ ':'
          ~ observability_kit_collector_itsm_port
          ~ observability_kit_collector_itsm_path
        )
      }}
    itsm_collector_webhook_username: >-
      {{ (demo_platform.observability | default({}, true)).itsm_webhook_username | default(observability_kit_itsm_webhook_username) }}
    itsm_collector_webhook_password: >-
      {{ (demo_platform.observability | default({}, true)).itsm_webhook_password | default(observability_kit_itsm_webhook_password) }}
    itsm_eda_webhook_activation_name: >-
      {{ demo_platform.eda.itsm_webhook_activation_name | default(aap_eda_itsm_webhook_pipeline_activation_name) }}
  no_log: true

- name: Fail when ITSM collector webhook URL is not in artifact
  ansible.builtin.fail:
    msg: >-
      demo_platform.observability.collector_itsm_url is missing. Run
      configure_observability_kit.yml and configure_aap_eda_itsm_webhook_pipeline.yml first.
  when: itsm_collector_webhook_base_url | length == 0

- name: Build itsm-app webhook URL for in-cluster OTel Collector ingress
  ansible.builtin.set_fact:
    itsm_collector_webhook_url: >-
      {{
        (
          'http://'
          ~ (itsm_collector_webhook_username | urlencode)
          ~ ':'
          ~ (itsm_collector_webhook_password | urlencode)
          ~ '@'
          ~ (
            demo_platform.observability.collector_internal_host
            | default(observability_kit_collector_internal_host)
          )
          ~ ':'
          ~ observability_kit_collector_itsm_port
          ~ observability_kit_collector_itsm_path
        )
      }}
  no_log: true

- name: Verify OTel Collector ITSM webhook accepts POST from inside cluster
  ansible.builtin.command:
    argv:
      - oc
      - run
      - itsm-collector-webhook-probe
      - --rm
      - -i
      - --restart=Never
      - -n
      - "{{ observability_kit_namespace }}"
      - --image=curlimages/curl:8.5.0
      - --
      - curl
      - -sf
      - -u
      - "{{ itsm_collector_webhook_username }}:{{ itsm_collector_webhook_password }}"
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"event":"incident.created","incident":{"public_id":"COLLECTOR-PROBE","title":"OTel Collector ingress probe","severity":"low"}}'
      - "{{ itsm_collector_webhook_base_url }}"
  register: itsm_collector_webhook_probe
  changed_when: false
  failed_when: itsm_collector_webhook_probe.rc != 0
  no_log: true

- name: Remove deprecated itsm-chat-bridge Deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ itsm_chat_bridge_name }}"
    namespace: "{{ itsm_chat_bridge_namespace }}"

- name: Remove deprecated itsm-chat-bridge Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ itsm_chat_bridge_name }}"
    namespace: "{{ itsm_chat_bridge_namespace }}"

- name: Remove deprecated itsm-chat-bridge ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ itsm_chat_bridge_name }}"
    namespace: "{{ itsm_chat_bridge_namespace }}"

- name: Register itsm-app outbound webhook to OTel Collector
  ansible.builtin.include_role:
    name: demos.utils.itsm_ansible_role
  vars:
    itsm_ansible_role_check_connection: false
    itsm_ansible_role_admin_settings: true
    itsm_ansible_role_users: false
    itsm_ansible_role_asset_types: false
    itsm_ansible_role_assets: false
    itsm_ansible_role_inventory: false
    itsm_ansible_role_kb: false
    itsm_ansible_role_incidents: false
    itsm_ansible_role_followups: false
    itsm_ansible_role_task_templates: false
    itsm_ansible_role_change_templates: false
    itsm_ansible_role_request_templates: false
    itsm_ansible_role_service_requests: false
    itsm_ansible_role_changes: false
    itsm_ansible_role_change_tasks: false
    itsm_webhooks:
      - url: "{{ itsm_collector_webhook_url }}"
        label: OTel Collector ITSM events
        enabled: true
    itsm_webhooks_remove_unlisted: true

- name: Obtain AAP gateway OAuth token for EDA activation status check
  ansible.builtin.uri:
    url: "{{ demo_platform.aap.gateway_url }}/api/gateway/v1/tokens/"
    method: POST
    user: "{{ demo_platform.aap.username }}"
    password: "{{ demo_platform.aap.password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      description: configure-itsm-collector-webhook activation check
      scope: write
    status_code: 201
  register: itsm_collector_webhook_gateway_token
  no_log: true

- name: Wait for ITSM Kafka rulebook activation to reach running state
  ansible.builtin.uri:
    url: >-
      {{ demo_platform.aap.gateway_url }}/api/eda/v1/activations/?name={{
      itsm_eda_webhook_activation_name | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ itsm_collector_webhook_gateway_token.json.token }}"
    validate_certs: false
    status_code: 200
    return_content: true
  register: itsm_collector_webhook_activation_status
  until: >
    (
      itsm_collector_webhook_activation_status.json.results
      | default([])
      | selectattr('name', 'equalto', itsm_eda_webhook_activation_name)
      | selectattr('status', 'equalto', 'running')
      | list
      | length
    ) > 0
  retries: 30
  delay: 5
  failed_when: false

- name: Fail when ITSM Kafka rulebook activation is missing or not running
  ansible.builtin.fail:
    msg: >-
      EDA activation '{{ itsm_eda_webhook_activation_name }}' is missing or not running.
      Re-run configure_aap_eda_itsm_webhook_pipeline.yml. Activations found:
      {{ itsm_collector_webhook_activation_status.json.count | default(0) }}.
  when: >
    (
      itsm_collector_webhook_activation_status.json.results
      | default([])
      | selectattr('name', 'equalto', itsm_eda_webhook_activation_name)
      | selectattr('status', 'equalto', 'running')
      | list
      | length
    ) == 0

- name: Authenticate to chat-app as admin for webhook verification
  ansible.builtin.uri:
    url: "{{ chat_api_base }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ chat_admin_username }}"
      password: "{{ chat_admin_password }}"
    validate_certs: false
    status_code: 200
  register: itsm_collector_webhook_chat_login
  no_log: true

- name: Create test incident in itsm-app for Kafka/EDA pipeline verification
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    body_format: json
    body:
      title: "{{ itsm_test_incident_title }}"
      description: "{{ itsm_test_incident_description }}"
      severity: "{{ itsm_test_incident_severity }}"
    status_code: 201
    return_content: true
  register: itsm_collector_webhook_test_incident_create
  until: itsm_collector_webhook_test_incident_create is succeeded
  retries: "{{ itsm_http_retries }}"
  delay: "{{ itsm_http_retry_delay }}"
- name: Record test incident public_id for chat verification
  ansible.builtin.set_fact:
    itsm_collector_webhook_test_incident_ref: "{{ itsm_collector_webhook_test_incident_create.json.public_id }}"
    itsm_collector_webhook_incident_body_pattern: >-
      ^\[incident\.created\] {{
      itsm_collector_webhook_test_incident_create.json.public_id | regex_escape
      }} —

- name: Wait for incident notification in chat operations channel
  ansible.builtin.uri:
    url: >-
      {{ chat_api_base }}/api/v1/channels/{{ chat_aiops_channel_name | urlencode }}/messages?limit=30
    method: GET
    headers:
      Authorization: "Bearer {{ itsm_collector_webhook_chat_login.json.access_token }}"
    validate_certs: false
    status_code: 200
    return_content: true
  register: itsm_collector_webhook_chat_messages
  until: >
    (
      itsm_collector_webhook_chat_messages.json['items']
      | default([])
      | map(attribute='body')
      | select('search', itsm_collector_webhook_incident_body_pattern)
      | list
      | length
    ) > 0
  retries: "{{ itsm_chat_webhook_verify_retries }}"
  delay: "{{ itsm_chat_webhook_verify_delay }}"

- name: Resolve chat message for test incident
  ansible.builtin.set_fact:
    itsm_collector_webhook_test_chat_message: >-
      {{
        (
          itsm_collector_webhook_chat_messages.json['items']
          | default([])
          | selectattr('body', 'search', itsm_collector_webhook_incident_body_pattern)
          | list
          | first
          | default({}, true)
        ).body | default('')
      }}

- name: Fail when chat message for test incident was not received
  ansible.builtin.fail:
    msg: >-
      No chat message containing '{{ itsm_collector_webhook_test_incident_ref }}' appeared in channel
      '{{ chat_aiops_channel_name }}' within {{
      itsm_chat_webhook_verify_retries * itsm_chat_webhook_verify_delay }}s.
      Check EDA activation '{{ itsm_eda_webhook_activation_name }}' and AAP job
      'Publish ITSM Chat Notification'.
  when: itsm_collector_webhook_test_chat_message | string | trim | length == 0

- name: Fail when chat message does not match incident.created format
  ansible.builtin.assert:
    that:
      - itsm_collector_webhook_test_chat_message is search('^\[incident\.created\]')
      - itsm_collector_webhook_test_incident_ref in itsm_collector_webhook_test_chat_message
      - itsm_test_incident_title in itsm_collector_webhook_test_chat_message
    fail_msg: >-
      Chat message '{{ itsm_collector_webhook_test_chat_message }}' does not match the expected
      [incident.created] INC-* — title (severity) format.

- name: Close test incident in itsm-app
  ansible.builtin.uri:
    url: >-
      {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents/{{
      itsm_collector_webhook_test_incident_ref | urlencode }}/close
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: false
    body_format: json
    body: {}
    status_code: 200
  register: itsm_http_result
  until: itsm_http_result is succeeded
  retries: "{{ itsm_http_retries }}"
  delay: "{{ itsm_http_retry_delay }}"
- name: Display ITSM collector webhook configuration summary
  ansible.builtin.debug:
    msg:
      - "itsm webhook (collector ingress): {{ itsm_collector_webhook_url | regex_replace('://[^@]+@', '://***@') }}"
      - "Collector ITSM URL: {{ itsm_collector_webhook_base_url }}"
      - "EDA activation: {{ itsm_eda_webhook_activation_name }}"
      - "test incident: {{ itsm_collector_webhook_test_incident_ref }} (closed)"
      - "chat verification: {{ itsm_collector_webhook_test_chat_message }}"
