---
- name: Ensure Install application packages job template exists in AAP
  awx.awx.job_template:
    name: "{{ aap_generic_app_pipeline_jt_install }}"
    organization: "{{ aap_generic_app_pipeline_organization }}"
    project: "{{ aap_generic_app_pipeline_project }}"
    inventory: "{{ aap_generic_app_pipeline_inventory }}"
    playbook: "{{ aap_generic_app_pipeline_playbook_install }}"
    job_type: run
    state: present
    survey_enabled: false
    extra_vars: "{{ aap_generic_app_pipeline_job_extra_vars }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ aap_generic_app_pipeline_credential_vms }}"
      - "{{ aap_generic_app_pipeline_credential_itsm }}"
      - "{{ aap_generic_app_pipeline_credential_aap }}"
    controller_host: "{{ aap_generic_app_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_generic_app_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_generic_app_pipeline_validate_certs }}"

