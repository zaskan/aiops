---
aap_generic_app_pipeline_organization: AIOps
aap_generic_app_pipeline_validate_certs: false
aap_generic_app_pipeline_controller_api_prefix: /api/controller/

aap_generic_app_pipeline_inventory: AIOps Infrastructure
aap_generic_app_pipeline_project: AIOps Playbooks

aap_generic_app_pipeline_jt_install: Install application packages
aap_generic_app_pipeline_jt_deploy: Deploy application repository
aap_generic_app_pipeline_jt_expose: Expose application
aap_generic_app_pipeline_jt_register_itsm: Register ITSM Generic Application Asset
aap_generic_app_pipeline_jt_start: Start application service
aap_generic_app_pipeline_workflow: Deploy Generic Application

aap_generic_app_pipeline_playbook_install: install_app_packages.yml
aap_generic_app_pipeline_playbook_deploy: deploy_generic_app.yml
aap_generic_app_pipeline_playbook_expose: expose_application.yml
aap_generic_app_pipeline_playbook_register_itsm: register_itsm_generic_app_asset.yml
aap_generic_app_pipeline_playbook_start: start_application_service.yml

aap_generic_app_pipeline_workflow_survey_spec:
  name: Deploy Generic Application
  description: Target VM, Gitea repository, packages, clone path, and systemd service
  spec:
    - question_name: target_host
      question_description: Hostname in AIOps Infrastructure (ITSM VM asset name)
      required: true
      type: text
      variable: target_host
    - question_name: app_repo
      question_description: Gitea repository name only (e.g. AIOps_App), not a URL
      required: true
      type: text
      variable: app_repo
      default: AIOps_App
    - question_name: app_branch
      question_description: Git branch to deploy
      required: false
      type: text
      variable: app_branch
      default: main
    - question_name: app_packages
      question_description: RPM packages to install (comma-separated)
      required: true
      type: text
      variable: app_packages
      default: httpd,git
    - question_name: app_clone_path
      question_description: Path on VM where the git repository is cloned
      required: true
      type: text
      variable: app_clone_path
      default: /var/www/html
    - question_name: app_service
      question_description: systemd service unit name for the application
      required: true
      type: text
      variable: app_service
      default: httpd

aap_generic_app_pipeline_credential_vms: Virtual Machines
aap_generic_app_pipeline_credential_gitea: Gitea
aap_generic_app_pipeline_credential_openshift: OpenShift Cluster

aap_generic_app_pipeline_artifacts_file: "{{ playbook_dir }}/../../artifacts/demo_platform_facts.yml"
