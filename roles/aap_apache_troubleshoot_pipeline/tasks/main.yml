---
- name: Run AAP Apache troubleshoot pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Sync AIOps Playbooks project from Gitea
  ansible.builtin.include_tasks: project_update.yml

- name: Configure AAP job templates for Apache alert remediation
  block:
    - name: Ensure Apache alert remediation job templates exist
      ansible.builtin.include_tasks: job_templates.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_apache_troubleshoot_pipeline_controller_api_prefix }}"

- name: Display AAP Apache troubleshoot pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_apache_troubleshoot_pipeline_organization }}"
      - "Project: {{ aap_apache_troubleshoot_pipeline_project }}"
      - "Job templates: {{ aap_apache_troubleshoot_pipeline_jt_create_incident }}, {{ aap_apache_troubleshoot_pipeline_jt_troubleshoot }}"
