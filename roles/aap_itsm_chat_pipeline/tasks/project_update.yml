---
- name: Sync AIOps Playbooks project before creating ITSM chat job template
  awx.awx.project_update:
    project: "{{ aap_itsm_chat_pipeline_project }}"
    organization: "{{ aap_itsm_chat_pipeline_organization }}"
    wait: true
    controller_host: "{{ aap_itsm_chat_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_itsm_chat_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_itsm_chat_pipeline_validate_certs }}"
  register: aap_itsm_chat_pipeline_project_update
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_itsm_chat_pipeline_controller_api_prefix }}"
  register: aap_controller_api_result
  until: aap_controller_api_result is succeeded
  retries: "{{ aap_controller_api_retries }}"
  delay: "{{ aap_controller_api_retry_delay }}"
- name: Fail when AIOps Playbooks SCM sync did not succeed
  ansible.builtin.fail:
    msg: >-
      AIOps Playbooks project SCM sync failed before ITSM chat job template creation
      ({{ aap_itsm_chat_pipeline_project_update.msg | default('unknown error') }}).
  when: aap_itsm_chat_pipeline_project_update.failed | default(false)
