---
- name: Run AAP ITSM chat pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for awx.awx API calls
  ansible.builtin.include_tasks: controller_auth.yml

- name: Configure AAP job template for ITSM chat notifications
  block:
    - ansible.builtin.include_tasks: configure.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_itsm_chat_pipeline_controller_api_prefix }}"
    CONTROLLER_REQUEST_TIMEOUT: "{{ aap_controller_request_timeout | string }}"

- name: Display AAP ITSM chat pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_itsm_chat_pipeline_organization }}"
      - "Project: {{ aap_itsm_chat_pipeline_project }}"
      - "Job template: {{ aap_itsm_chat_pipeline_jt_publish }}"
