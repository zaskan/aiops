---
- name: Init lookup maps for ITSM Ansible role
  ansible.builtin.set_fact:
    itsm_asset_type_by_name: {}
    itsm_inventory_by_hostname: {}
    itsm_kb_by_title: {}
    itsm_incident_by_key: {}

- name: Connection smoke check
  ansible.builtin.include_tasks: connection.yml

- name: Admin settings (app title, branding, webhook)
  ansible.builtin.include_tasks: admin_settings.yml

- name: Create users
  ansible.builtin.include_tasks: users.yml

- name: Create asset types
  ansible.builtin.include_tasks: asset_types.yml

- name: Create inventory
  ansible.builtin.include_tasks: inventory.yml

- name: Create KB articles
  ansible.builtin.include_tasks: kb.yml

- name: Create incidents
  ansible.builtin.include_tasks: incidents.yml

- name: Incident follow-ups (comments and close)
  ansible.builtin.include_tasks: incident_followups.yml
