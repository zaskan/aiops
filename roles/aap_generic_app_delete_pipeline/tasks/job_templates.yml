    controller_host: "{{ aap_generic_app_delete_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_generic_app_delete_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_generic_app_delete_pipeline_validate_certs }}"
  no_log: true

- name: Ensure Delete ITSM VM Asset job template exists in AAP
  awx.awx.job_template:
    name: "{{ aap_generic_app_delete_pipeline_jt_delete_itsm_vm }}"
    organization: "{{ aap_generic_app_delete_pipeline_organization }}"
    project: "{{ aap_generic_app_delete_pipeline_project }}"
    inventory: "{{ aap_generic_app_delete_pipeline_inventory }}"
    playbook: "{{ aap_generic_app_delete_pipeline_playbook_delete_itsm_vm }}"
    job_type: run
    state: present
    survey_enabled: false
    extra_vars: "{{ aap_generic_app_delete_job_extra_vars }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ aap_generic_app_delete_pipeline_credential_itsm }}"
      - "{{ aap_generic_app_delete_pipeline_credential_aap }}"
    controller_host: "{{ aap_generic_app_delete_pipeline_controller_host }}"
    controller_oauthtoken: "{{ aap_generic_app_delete_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_generic_app_delete_pipeline_validate_certs }}"
  no_log: true
