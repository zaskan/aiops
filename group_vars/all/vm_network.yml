---
# Fixed IP pool for KubeVirt VMs on the aiops-demo secondary UDN (Layer2).
# Subnet must not overlap the cluster default pod network (e.g. 10.128.0.0/14 on OCP).
# Install creates UserDefinedNetwork aiops-vm-network (ipam.mode: Disabled) via
# roles/demo_platform/tasks/prepare_aiops_demo_udn.yml after preflight in check_vm_fixed_ip_network.yml.
vm_ip_pool_start: 192.168.100.100
vm_ip_pool_end: 192.168.100.250
vm_ip_prefix_length: 24
vm_ip_annotation: aiops.io/ip-address
vm_udn_name: aiops-vm-network
vm_udn_pod_interface: net1
vm_primary_guest_interface: enp1s0
vm_secondary_guest_interface: enp2s0
