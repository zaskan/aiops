---
itsm_agent_enabled: true
itsm_agent_git_url: "https://github.com/zaskan/itsm-agent.git"
itsm_agent_git_ref: main
itsm_agent_namespace: itsm-agent
itsm_agent_manifest_base: "https://raw.githubusercontent.com/zaskan/itsm-agent/{{ itsm_agent_git_ref }}/k8s"
itsm_agent_source_repo_url: "{{ itsm_agent_git_url | trim | regex_replace('/$', '') }}#{{ itsm_agent_git_ref }}"
itsm_agent_chat_service: demo-chat
itsm_agent_chat_port: 8000
itsm_agent_itsm_service: itsm-app
itsm_agent_itsm_port: 8000
itsm_agent_llm_base_url: "{{ lookup('ansible.builtin.env', 'ITSM_AGENT_LLM_BASE_URL', default='') }}"
itsm_agent_llm_api_key: "{{ lookup('ansible.builtin.env', 'ITSM_AGENT_LLM_API_KEY', default='') }}"
itsm_agent_llm_model: "{{ lookup('ansible.builtin.env', 'ITSM_AGENT_LLM_MODEL', default='llama-scout-17b') }}"
itsm_agent_llm_embedding_model: "{{ lookup('ansible.builtin.env', 'ITSM_AGENT_EMBEDDING_MODEL', default='') }}"
itsm_agent_aap_tls_verify: "false"
itsm_agent_apache_asset_extra_vars_patch: false
itsm_agent_lightspeed_remediation_patch: false
itsm_agent_lightspeed_routing_patch: false
itsm_agent_lightspeed_api_url: "{{ lookup('ansible.builtin.env', 'AAP_LIGHTSPEED_API_URL', default='') }}"
itsm_agent_lightspeed_api_token: "{{ lookup('ansible.builtin.env', 'AAP_LIGHTSPEED_API_TOKEN', default='') }}"
itsm_agent_lightspeed_api_tls_verify: "{{ lookup('ansible.builtin.env', 'AAP_LIGHTSPEED_TLS_VERIFY', default='false') }}"
itsm_agent_lightspeed_discover_namespace: "{{ lookup('ansible.builtin.env', 'AAP_LIGHTSPEED_DISCOVER_NAMESPACE', default='aap') }}"
itsm_agent_lightspeed_allow_litellm_fallback: "{{ lookup('ansible.builtin.env', 'AAP_LIGHTSPEED_ALLOW_LITELLM_FALLBACK', default='true') }}"
