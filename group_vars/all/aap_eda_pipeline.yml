---
aap_eda_pipeline_organization: Default
aap_eda_pipeline_validate_certs: false

aap_eda_pipeline_project: AIOps Rulebooks
aap_eda_pipeline_gitea_repo: Rulebooks
aap_eda_pipeline_scm_branch: main
aap_eda_pipeline_gitea_scm_use_internal: true
aap_eda_pipeline_gitea_scm_internal_host: gitea-http.gitea.svc.cluster.local:3000

aap_eda_pipeline_controller_credential: AAP Controller Token
aap_eda_pipeline_controller_credential_host_suffix: /api/controller/
aap_eda_pipeline_gitea_credential: Gitea Rulebooks SCM

aap_eda_pipeline_rulebook: apache_alert_incident.yml
aap_eda_pipeline_activation_name: Apache Alert Incident Activation
aap_eda_pipeline_decision_environment: AIOps Decision Environment
aap_eda_pipeline_decision_environment_image: registry.redhat.io/ansible-automation-platform-27/de-minimal-rhel9:latest
aap_eda_pipeline_rulebook_source_name: listen for alerts

aap_eda_pipeline_kafka_bootstrap: "{{ observability_kit_kafka_internal_bootstrap }}"
aap_eda_pipeline_kafka_topic_alertmanager: "{{ observability_kit_kafka_topic_alertmanager }}"

# Restart EDA activations on every pipeline configure run (avoids stale pods that
# consume Kafka but never fire rules). Safe for install.yml re-runs.
aap_eda_activation_restart_on_run: true
