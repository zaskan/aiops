---
validate_certs: false

# itsm-app
itsm_app_git_url: "https://github.com/zaskan/itsm-app.git"
itsm_app_git_ref: main
itsm_app_namespace: itsm-app
itsm_app_manifest_base: "https://raw.githubusercontent.com/zaskan/itsm-app/{{ itsm_app_git_ref }}/k8s"
itsm_app_source_repo_url: "{{ itsm_app_git_url | trim | regex_replace('/$', '') }}#{{ itsm_app_git_ref }}"
itsm_app_session_secret: "{{ lookup('ansible.builtin.env', 'ITSM_SESSION_SECRET') | default('replace-with-long-random-string', true) }}"
itsm_app_mcp_token: "{{ lookup('ansible.builtin.env', 'ITSM_MCP_TOKEN') | default('084f926a012ae68ff7928033beeeef08e4e3c99304d98f8bf9b2521e13b6fc50', true) }}"
itsm_app_bootstrap_admin_user: "{{ lookup('ansible.builtin.env', 'ITSM_BOOTSTRAP_ADMIN_USER') | default('admin', true) }}"
itsm_app_bootstrap_admin_password: "{{ lookup('ansible.builtin.env', 'ITSM_BOOTSTRAP_ADMIN_PASSWORD') | default('admin', true) }}"
itsm_app_rag_enabled: true
itsm_app_vllm_embedding_patch: true
itsm_app_catalog_ritm_patch: true
itsm_app_embedding_base_url: "{{ lookup('ansible.builtin.env', 'ITSM_EMBEDDING_BASE_URL', default='') }}"
itsm_app_embedding_api_key: "{{ lookup('ansible.builtin.env', 'ITSM_EMBEDDING_API_KEY', default='') }}"
itsm_app_embedding_model: "{{ lookup('ansible.builtin.env', 'ITSM_EMBEDDING_MODEL', default='') }}"
itsm_agent_llm_embedding_model: "{{ lookup('ansible.builtin.env', 'ITSM_AGENT_EMBEDDING_MODEL', default='') }}"

# chat-app
chat_app_git_url: "https://github.com/zaskan/chat-app.git"
chat_app_git_ref: main
chat_app_namespace: demo-chat
chat_app_manifest_base: "https://raw.githubusercontent.com/zaskan/chat-app/{{ chat_app_git_ref }}/k8s"
chat_app_source_repo_url: "{{ chat_app_git_url | trim | regex_replace('/$', '') }}#{{ chat_app_git_ref }}"
chat_app_jwt_secret: "{{ lookup('ansible.builtin.env', 'CHAT_JWT_SECRET') | default('replace-with-long-random-string', true) }}"
chat_app_seed_admin_username: "{{ lookup('ansible.builtin.env', 'CHAT_SEED_ADMIN_USERNAME') | default('admin', true) }}"
chat_app_seed_admin_password: "{{ lookup('ansible.builtin.env', 'CHAT_SEED_ADMIN_PASSWORD') | default('changeme', true) }}"

# gitea
gitea_namespace: gitea
gitea_kustomize_overlay: "https://github.com/zaskan/gitea/deploy/overlays/openshift"
gitea_admin_user: "{{ lookup('ansible.builtin.env', 'GITEA_ADMIN_USER') | default('giteaadmin', true) }}"
gitea_admin_password: "{{ lookup('ansible.builtin.env', 'GITEA_ADMIN_PASSWORD') | default('changeme-gitea-admin-password', true) }}"
gitea_admin_email: "{{ lookup('ansible.builtin.env', 'GITEA_ADMIN_EMAIL') | default('admin@example.com', true) }}"
gitea_secret_key: "{{ lookup('ansible.builtin.env', 'GITEA_SECRET_KEY') | default('changeme-gitea-secret-key', true) }}"
gitea_postgres_password: "{{ lookup('ansible.builtin.env', 'GITEA_POSTGRES_PASSWORD') | default('changeme-gitea-db-password', true) }}"
# Set true to wipe postgres-data PVC (fixes corrupt checkpoint / version mismatch; re-run install to reprovision gitea).
gitea_postgres_reset_pvc: "{{ lookup('ansible.builtin.env', 'GITEA_POSTGRES_RESET_PVC', default='false') | bool }}"

# AAP optional override after auto-discover
aap_password_override: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD', default='') }}"
aap_username_override: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME', default='') }}"

# Ansible Automation Platform MCP server (operator-based, Technology Preview)
aap_mcp_server_api_version: mcpserver.ansible.com/v1alpha1
aap_mcp_deployment_label_selector: app.kubernetes.io/name=ansible-mcp
aap_mcp_enabled: true
aap_mcp_allow_write_operations: true
aap_mcp_ignore_certificate_errors: true
aap_mcp_token_scope: write
aap_mcp_token_description: aiops-demo-mcp
aap_mcp_token_override: "{{ lookup('ansible.builtin.env', 'AAP_MCP_TOKEN', default='') }}"
aap_mcp_wait_retries: 60
aap_mcp_wait_delay: 10
aap_mcp_toolsets:
  - job_management
  - inventory_management
  - system_monitoring
  - user_management
  - security_compliance
  - platform_configuration

# OpenShift Virtualization
openshift_virt_operator_namespace: openshift-cnv
openshift_virt_hyperconverged_name: kubevirt-hyperconverged

# VM demo namespace and SSH secret for KubeVirt
aiops_demo_namespace: aiops-demo
aiops_demo_vms_rsa_secret_name: authorized-keys
aiops_demo_vms_secret_data_key: key
aiops_demo_vms_legacy_secret_name: vms-rsa
aiops_demo_vms_rsa_key_size: 4096
aiops_demo_vms_rsa_temp_dir: /tmp/aiops-demo-vms-rsa
aiops_demo_vms_ssh_username: fedora
aiops_demo_vm_udn_name: aiops-vm-network
aiops_demo_vm_udn_ready_retries: 30
aiops_demo_vm_udn_ready_delay: 10
demo_platform_write_artifacts: true
demo_platform_artifacts_dir: "{{ playbook_dir }}/../artifacts"

# Uninstall (playbooks/uninstall.yml)
uninstall_assume_yes: false
uninstall_keep_gitea_data: false
uninstall_delete_gitea_namespace: true
uninstall_remove_artifacts: true
uninstall_remove_aap: true
uninstall_aap_remove_credential_types: true
uninstall_remove_openshift_sa: true
