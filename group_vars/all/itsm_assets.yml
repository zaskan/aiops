---
itsm_vm_asset_type_name: Virtual Machine
itsm_generic_app_asset_type_name: Generic Application

itsm_asset_types:
  - name: "{{ itsm_vm_asset_type_name }}"
    description: KubeVirt-provisioned virtual machine
    fields:
      - { field_key: hostname, label: Hostname, field_type: text }
      - { field_key: ip_address, label: IP address, field_type: text }
      - { field_key: ansible_host, label: Ansible SSH host, field_type: text }
      - { field_key: cpus, label: CPUs, field_type: number }
      - { field_key: memory, label: Memory GiB, field_type: number }
  - name: "{{ itsm_generic_app_asset_type_name }}"
    description: Application deployed on a provisioned VM (packages and clone path from extra vars)
    fields:
      - { field_key: hostname, label: Hostname, field_type: text }
      - { field_key: vm_hostname, label: VM hostname, field_type: text }
      - { field_key: ip_address, label: IP address, field_type: text }
      - { field_key: app_repo, label: Application repository, field_type: text }
      - { field_key: app_branch, label: Git branch, field_type: text }
      - { field_key: git_commit, label: Deployed git commit, field_type: text }
      - { field_key: route_url, label: Route URL, field_type: text }
      - { field_key: rpms, label: Installed RPM packages, field_type: text }
      - { field_key: clone_path, label: Git clone path, field_type: text }
      - { field_key: app_service, label: systemd service unit, field_type: text }

itsm_ansible_role_check_connection: true
itsm_ansible_role_admin_settings: false
itsm_ansible_role_users: false
itsm_ansible_role_asset_types: true
itsm_ansible_role_assets: false
itsm_ansible_role_inventory: false
itsm_ansible_role_kb: false
itsm_ansible_role_incidents: false
itsm_ansible_role_followups: false
itsm_ansible_role_task_templates: false
itsm_ansible_role_change_templates: false
itsm_ansible_role_request_templates: false
itsm_ansible_role_service_requests: false
itsm_ansible_role_changes: false
itsm_ansible_role_change_tasks: false
